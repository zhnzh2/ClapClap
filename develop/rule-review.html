<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>2.0 规则疑义审核 — ClapClap</title>
<style>
  :root {
    --bg: #0f1117;
    --card: #1a1d27;
    --card-hover: #1f2233;
    --border: #2a2d3a;
    --text: #e1e4eb;
    --text-secondary: #8b8fa3;
    --accent: #6c8cff;
    --accent-glow: rgba(108, 140, 255, 0.15);
    --agree: #2ea043;
    --agree-bg: rgba(46, 160, 67, 0.1);
    --disagree: #d97706;
    --disagree-bg: rgba(217, 119, 6, 0.1);
    --pending: #8b8fa3;
    --radius: 10px;
    --radius-sm: 6px;
    --transition: 0.2s ease;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans SC", sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.6;
    min-height: 100vh;
  }

  /* ── 顶部导航 ── */
  .topbar {
    position: sticky; top: 0; z-index: 100;
    background: var(--bg);
    border-bottom: 1px solid var(--border);
    padding: 0 24px;
    display: flex; align-items: center; justify-content: space-between;
    height: 56px;
    backdrop-filter: blur(12px);
  }
  .topbar .logo { font-weight: 700; font-size: 16px; color: var(--accent); letter-spacing: -0.3px; }
  .topbar .logo span { color: var(--text-secondary); font-weight: 400; margin-left: 6px; }
  .topbar .actions { display: flex; gap: 8px; align-items: center; }

  /* ── 按钮 ── */
  .btn {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 7px 14px; border-radius: var(--radius-sm);
    font-size: 13px; font-weight: 500; cursor: pointer;
    border: 1px solid var(--border); background: var(--card);
    color: var(--text); transition: all var(--transition);
    white-space: nowrap;
  }
  .btn:hover { background: var(--card-hover); border-color: #4a4f60; }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .btn.primary:hover { filter: brightness(1.1); }
  .btn.ghost { background: transparent; border-color: transparent; color: var(--text-secondary); }
  .btn.ghost:hover { color: var(--text); background: var(--card); }

  /* ── 统计栏 ── */
  .stats-bar {
    display: flex; gap: 1px; background: var(--border);
    margin: 0 24px; border-radius: var(--radius); overflow: hidden;
  }
  .stats-bar .stat {
    flex: 1; background: var(--card); padding: 14px 20px;
    text-align: center;
  }
  .stat .num { font-size: 28px; font-weight: 700; letter-spacing: -0.5px; }
  .stat .label { font-size: 12px; color: var(--text-secondary); margin-top: 2px; }
  .stat .num.agree { color: var(--agree); }
  .stat .num.disagree { color: var(--disagree); }
  .stat .num.pending { color: var(--pending); }

  /* ── 主体布局 ── */
  .layout { display: flex; gap: 0; max-width: 1400px; margin: 0 auto; padding: 0 24px; }

  /* ── 侧边目录 ── */
  .sidebar {
    position: sticky; top: 80px;
    width: 220px; flex-shrink: 0;
    padding: 20px 16px 20px 0;
    max-height: calc(100vh - 100px);
    overflow-y: auto;
    border-right: 1px solid var(--border);
  }
  .sidebar .cat {
    display: block; padding: 7px 12px; border-radius: var(--radius-sm);
    font-size: 13px; color: var(--text-secondary); cursor: pointer;
    text-decoration: none; transition: all var(--transition);
    margin-bottom: 2px;
  }
  .sidebar .cat:hover { color: var(--text); background: var(--card); }
  .sidebar .cat.active { color: var(--accent); background: var(--accent-glow); font-weight: 500; }
  .sidebar .cat .badge {
    float: right; font-size: 11px; background: var(--border);
    padding: 1px 7px; border-radius: 10px; color: var(--text-secondary);
  }

  /* ── 主内容区 ── */
  .main { flex: 1; min-width: 0; padding: 20px 0 60px 24px; }

  .section-title {
    font-size: 20px; font-weight: 700; margin: 32px 0 16px;
    padding-bottom: 10px; border-bottom: 1px solid var(--border);
    display: flex; align-items: center; gap: 10px;
  }
  .section-title:first-child { margin-top: 0; }
  .section-title .tag {
    font-size: 11px; padding: 3px 10px; border-radius: 12px;
    background: var(--accent-glow); color: var(--accent); font-weight: 500;
  }

  /* ── 问题卡片 ── */
  .qa-card {
    background: var(--card); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 20px;
    margin-bottom: 12px;
    transition: border-color var(--transition);
  }
  .qa-card.answered-agree { border-left: 3px solid var(--agree); }
  .qa-card.answered-disagree { border-left: 3px solid var(--disagree); }
  .qa-card:hover { border-color: #4a4f60; }

  .qa-card .q-header {
    display: flex; align-items: flex-start; gap: 12px;
    margin-bottom: 10px;
  }
  .qa-card .q-num {
    font-size: 12px; font-weight: 700; color: var(--accent);
    background: var(--accent-glow); padding: 2px 8px; border-radius: 4px;
    flex-shrink: 0; margin-top: 2px;
  }
  .qa-card .q-text {
    font-size: 14px; font-weight: 600; color: var(--text);
    flex: 1;
  }

  .qa-card .recommendation {
    background: #11151f; border: 1px solid var(--border);
    border-radius: var(--radius-sm); padding: 10px 14px;
    margin-bottom: 12px; font-size: 13px; color: var(--text-secondary);
  }
  .qa-card .recommendation strong { color: #9db4ff; }

  /* ── 回答区 ── */
  .answer-row {
    display: flex; gap: 10px; align-items: center; flex-wrap: wrap;
  }
  .answer-row .pill {
    padding: 6px 14px; border-radius: 20px; font-size: 13px;
    cursor: pointer; border: 1px solid var(--border); background: transparent;
    color: var(--text-secondary); transition: all var(--transition);
    user-select: none;
  }
  .answer-row .pill:hover { border-color: #5a5f70; color: var(--text); }
  .answer-row .pill.selected-agree {
    background: var(--agree-bg); border-color: var(--agree); color: var(--agree);
  }
  .answer-row .pill.selected-disagree {
    background: var(--disagree-bg); border-color: var(--disagree); color: var(--disagree);
  }

  .custom-input {
    display: none; width: 100%; margin-top: 10px;
  }
  .custom-input.show { display: block; }
  .custom-input textarea {
    width: 100%; background: #11151f; border: 1px solid var(--border);
    border-radius: var(--radius-sm); color: var(--text); font-size: 13px;
    padding: 10px 14px; resize: vertical; min-height: 60px;
    font-family: inherit; line-height: 1.5;
  }
  .custom-input textarea:focus {
    outline: none; border-color: var(--accent);
  }

  /* ── Toast ── */
  .toast {
    position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
    background: #2ea043; color: #fff; padding: 10px 24px;
    border-radius: 20px; font-size: 13px; font-weight: 500;
    z-index: 999; opacity: 0; transition: opacity 0.3s;
    pointer-events: none;
  }
  .toast.show { opacity: 1; }

  /* ── 响应式 ── */
  @media (max-width: 900px) {
    .layout { flex-direction: column; padding: 0 12px; }
    .sidebar {
      position: static; width: 100%; border-right: none; border-bottom: 1px solid var(--border);
      display: flex; overflow-x: auto; padding: 12px 0; max-height: none;
      gap: 4px;
    }
    .sidebar .cat { white-space: nowrap; flex-shrink: 0; }
    .main { padding: 16px 0 40px; }
    .stats-bar { margin: 0 12px; flex-wrap: wrap; }
  }
</style>
</head>
<body>

<!-- 顶栏 -->
<div class="topbar">
  <div class="logo">ClapClap <span>/ 2.0 规则疑义审核</span></div>
  <div class="actions">
    <span id="progress-label" style="font-size:12px;color:var(--text-secondary)">—</span>
    <button class="btn ghost" onclick="resetAll()" title="清除所有回答">⟳ 重置</button>
    <button class="btn" onclick="exportAnswers()">📋 导出</button>
    <button class="btn" onclick="importAnswers()">📂 导入</button>
  </div>
</div>

<!-- 统计栏 -->
<div class="stats-bar">
  <div class="stat"><div class="num" id="count-total">34</div><div class="label">总计</div></div>
  <div class="stat"><div class="num agree" id="count-agree">0</div><div class="label">同意推荐</div></div>
  <div class="stat"><div class="num disagree" id="count-disagree">0</div><div class="label">自定义答案</div></div>
  <div class="stat"><div class="num pending" id="count-pending">34</div><div class="label">待审核</div></div>
</div>

<div class="layout">
  <!-- 侧边目录 -->
  <nav class="sidebar" id="sidebar"></nav>

  <!-- 主内容 -->
  <div class="main" id="main-content"></div>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<script>
// ── 数据：34 条规则疑义 ──
const SECTIONS = [
  {
    id: '1.1', title: '房间基本参数', tag: '10 项',
    items: [
      { id: '1.1.1', q: '最少几名玩家才能开始？', rec: '最少 <b>3 人</b>。2 人应走 1.0 双人模式；3 人是三连机制成立的最小人数。' },
      { id: '1.1.2', q: '房间人数上限？', rec: '上限 <b>6 人</b>。两组三连（六人）是规则书中明确描述的最大结构；超过 6 人同速协商复杂度爆炸。' },
      { id: '1.1.3', q: '人数是否固定？还是只设最大？', rec: '<b>只设最大人数，不固定</b>。允许 3~6 人范围内开始，更灵活。' },
      { id: '1.1.4', q: '房主能否在人数未满时提前开始？', rec: '<b>可以</b>。但需满足最少人数（≥3），且房主手动点击开始。' },
      { id: '1.1.5', q: '是否允许中途加入？', rec: '<b>对局开始后不允许加入参战席</b>。加入新玩家会破坏资源平衡和回合连续性。' },
      { id: '1.1.6', q: '开始后是否允许加入为观战者？', rec: '<b>允许</b>。观战不影响对局状态，且 2.0 多人局观战价值高。' },
      { id: '1.1.7', q: '玩家死亡后是留在房间观战还是退出？', rec: '<b>自动转为观战者</b>，留在房间内可以看后续回合和聊天。观战者不参与结算。' },
      { id: '1.1.8', q: '是否存在固定座位顺序？', rec: '<b>有固定座位顺序，按加入顺序排列</b>。但座位不影响可攻击目标范围（见 1.1.10）。' },
      { id: '1.1.9', q: '围成一圈是否影响可攻击目标范围？', rec: '<b>不影响。可以攻击任意存活玩家</b>。规则书中攻击手势的描述没有任何相邻限制，围成一圈只是现实动作设定。' },
      { id: '1.1.10', q: '是否允许攻击任意存活玩家？', rec: '<b>是</b>。任意存活且满足该手势目标条件的玩家均可被选为目标。' },
    ]
  },
  {
    id: '1.2', title: '胜负边界', tag: '8 项',
    items: [
      { id: '1.2.1', q: '同一回合所有人同时死亡如何处理？', rec: '<b>平局</b>。所有参与者并列，不产生冠军。' },
      { id: '1.2.2', q: '最后两人同时死亡是否平局？', rec: '<b>平局</b>。与 1.2.1 一致——只要最后存活人数变为 0，就是平局。' },
      { id: '1.2.3', q: '非法动作导致多人同时死亡时如何处理？', rec: '处罚死亡与正常死亡在<b>同一回合结算</b>。若处罚后只剩一人存活，则该玩家获胜。' },
      { id: '1.2.4', q: '玩家掉线、超时、主动投降是否视为死亡？', rec: '<b>主动投降</b>：视为死亡，本回合仍参与结算；<b>超时未出招</b>：视为「蛤蟆」直接死亡；<b>掉线</b>：见 1.2.5。' },
      { id: '1.2.5', q: '房主离开是否转移房主？', rec: '<b>是，自动转移</b>给房间内第一个加入的其他玩家（优先存活玩家 > 已死亡/观战玩家）。' },
      { id: '1.2.6', q: '只剩一人在线但其他人未正式死亡时如何处理？', rec: '给掉线玩家一个<b>60 秒宽限期</b>。宽限期内重连则继续；超时则掉线玩家视为投降死亡。' },
      { id: '1.2.7', q: '是否记录完整名次？还是只记录冠军？', rec: '<b>记录完整名次</b>。同回合死亡的玩家并列同一名次。这对战绩系统很重要。' },
      { id: '1.2.8', q: '同回合死亡的玩家是否并列？', rec: '<b>是，并列</b>。例如 4 人局第 3 回合 A 和 B 同时死亡，则两人并列第 3 名。' },
    ]
  },
  {
    id: '1.3', title: '资源与死亡顺序', tag: '⚠️ 最关键', items: [
      { id: '1.3.1', q: '加镐消耗多少资源？', rec: '沿用 1.0 设定：<b>消耗 2 格气</b>。这看起来是 2.0 规则书漏写，不是有意改动。' },
      { id: '1.3.2', q: '玩家生命值降至 0 后，如果本回合稍后获得镐，是恢复生命还是已失去资格？', rec: '死亡判定在<b>回合结束后统一进行</b>。回合进行中生命值降至 0 不会立即死亡，若后续速度层获得镐仍可恢复。爆镐的「立即死亡」是特殊规则。' },
      { id: '1.3.3', q: '镐抵挡多段伤害时按每段处理还是按总伤害处理？', rec: '<b>按每段处理</b>。每 1 点伤害消耗 1 个镐。黑洞 3 段全打同一玩家需要 3 个镐才能全部抵挡。' },
      { id: '1.3.4', q: '黑洞三段同时命中同一玩家时，镐在哪个时点消耗？', rec: '三段小黑洞<b>同时结算</b>（同属黑洞速度层），镐依次消耗。若玩家原本有 1 个镐，挡住第 1 段后镐消失，第 2、3 段直接造成伤害。' },
      { id: '1.3.5', q: '爆镐是在获得第二个镐的瞬间死亡，还是回合末统一判定？', rec: '<b>立即死亡</b>，区别于其他死亡判定。规则书用词是「立即」，爆镐玩家立即标记死亡，不再参与本回合后续速度层。' },
      { id: '1.3.6', q: '被抢镐、获得镐、镐复活和爆镐之间的精确顺序？', rec: '同速度层内：①处理目标声明和冲突 → ②同时执行攻击（含 gi 抢镐）→ ③同时执行资源获得（含加镐）→ ④先扣减再加 → ⑤每次获得镐后立即检查爆镐。' },
      { id: '1.3.7', q: 'Fire 的衍生资源（火种）和闪电的衍生资源（电池）在什么时点获得？', rec: 'Fire（速度层 9）和闪电（速度层 8）在<b>各自速度层结算时获得</b>。被吃掉的闪电不获得电池；三连中的 Fire 仍获得火种、三连中的闪电不获得电池。' },
    ]
  },
  {
    id: '1.4', title: '协商变协议', tag: '最复杂', items: [
      { id: '1.4.1', q: '同速玩家是否先秘密选择目标，再统一公开？', rec: '<b>先秘密选择，再统一公开</b>。流程：后端下发合法目标 → 玩家秘密提交 → 全部提交后统一公开 → 检测冲突 → 有冲突进入协商。' },
      { id: '1.4.2', q: '公开后可以修改几次？', rec: '<b>最多 3 轮协商，每轮限时 30 秒</b>。3 轮后仍未解决的冲突由程序强制裁定。' },
      { id: '1.4.3', q: '哪些玩家有权参与某一速度层的协商？', rec: '只有<b>该速度层中有资格操作的玩家</b>（出该速度层手势、且仍为未操作对象的存活玩家）。其他玩家只能观看。' },
      { id: '1.4.4', q: '玩家长时间不确认时如何处理（超时默认行为）？', rec: '分级处理：<b>目标选择超时</b>→ gi 从合法目标中随机选一个，其他手势默认放空；<b>协商阶段超时</b>→ 维持原意向；<b>被攻击者选择超时</b>→ 随机决定。' },
      { id: '1.4.5', q: '一般冲突中"没谈拢的人放空"如何由程序判断？', rec: '采用<b>确定性冲突分解算法</b>：①单方面冲突成立；②互指冲突双方对掉；③多人指向同一目标→多攻击少冲突；④协商未解决→攻击力低者放空，同攻击力双方都放空。<b>冲突识别和分解由后端引擎执行</b>。' },
      { id: '1.4.6', q: '多人攻击同一目标时，被攻击者如何选择攻击者？', rec: '①后端识别多攻击少冲突，通知被攻击者；②被攻击者从所有攻击者中<b>选择一人</b>（或选「全部放空」）；③被选中的攻击者正常结算，未被选中的放空。' },
      { id: '1.4.7', q: '被攻击者不选择时如何随机？随机结果如何记录保证回放复现？', rec: '使用<b>确定性伪随机</b>：种子 = <code>battle_id + round_number + speed_layer_index</code>。种子和随机结果都写入对局记录，回放页面直接读取已记录结果。' },
      { id: '1.4.8', q: '拆分黑洞、Shining、双吃时，所有分段目标如何一次性提交？', rec: '前端为拆分技能显示<b>对应数量的目标槽</b>（黑洞 3 个、Shining 2 个、双吃 2 个），每个槽独立选择目标，所有槽<b>同时提交</b>，后端一次性接收并验证。' },
      { id: '1.4.9', q: '某一段找不到合法目标时，其他段是否仍然执行？', rec: '<b>该段放空，其余段正常执行</b>。黑洞、Shining、双吃均适用。gi 不能拆分的规则不变——如果黑洞某段指向 gi 但 gi 不是合法目标，该段放空。' },
      { id: '1.4.10', q: '三连 1,1,多 时，由谁选择？超时怎么处理？', rec: '由<b>克制多人方的那一方</b>（单人方）从多人方中选择一人。限时 30 秒，超时则从多人方中随机选一人，随机种子写入对局记录。' },
      { id: '1.4.11', q: '三连 1,多,多 时，选择链路超时怎么处理？', rec: '第一步：单人方从自己克制的多人方中选一人（30s 超时→随机）；第二步：被选中的人从自己克制的另一多人方中选一人（30s 超时→随机）。两步都写入对局记录。' },
    ]
  },
];

// ── 状态管理 ──
const STORAGE_KEY = 'clapclap-rule-review-answers';
let answers = {};

function loadAnswers() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) answers = JSON.parse(raw);
  } catch (e) { answers = {}; }
}
function saveAnswers() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(answers));
  updateStats();
}

function getAnswer(itemId) {
  return answers[itemId] || null;
}
function setAnswer(itemId, type, customText) {
  answers[itemId] = { type, custom: customText || '', time: Date.now() };
  saveAnswers();
  refreshCardUI(itemId);
}

// ── 渲染 ──
function buildSidebar() {
  const nav = document.getElementById('sidebar');
  let html = '';
  for (const sec of SECTIONS) {
    const total = sec.items.length;
    const answered = sec.items.filter(it => getAnswer(it.id)).length;
    html += `<a class="cat" href="#sec-${sec.id}">${sec.id} ${sec.title}<span class="badge">${answered}/${total}</span></a>`;
  }
  nav.innerHTML = html;
}

function buildMain() {
  const main = document.getElementById('main-content');
  let html = '';
  for (const sec of SECTIONS) {
    html += `<div class="section-title" id="sec-${sec.id}"><span class="tag">${sec.tag}</span>${sec.id} ${sec.title}</div>`;
    for (const item of sec.items) {
      const ans = getAnswer(item.id);
      let cardClass = '';
      if (ans && ans.type === 'agree') cardClass = ' answered-agree';
      else if (ans && ans.type === 'disagree') cardClass = ' answered-disagree';

      html += `
      <div class="qa-card${cardClass}" id="card-${item.id}">
        <div class="q-header">
          <span class="q-num">${item.id}</span>
          <span class="q-text">${item.q}</span>
        </div>
        <div class="recommendation">💡 <strong>AI 推荐：</strong>${item.rec}</div>
        <div class="answer-row" id="row-${item.id}">
          <span style="font-size:12px;color:var(--text-secondary);margin-right:4px;">你的决定：</span>
          <span class="pill" id="pill-agree-${item.id}" onclick="setAnswer('${item.id}','agree')">✓ 同意推荐</span>
          <span class="pill" id="pill-disagree-${item.id}" onclick="showCustom('${item.id}')">✎ 不同意，自定义</span>
        </div>
        <div class="custom-input" id="custom-${item.id}">
          <textarea id="ta-${item.id}" placeholder="写下你的答案…" oninput="onCustomInput('${item.id}')">${ans ? ans.custom || '' : ''}</textarea>
          <div style="margin-top:8px;display:flex;gap:8px;">
            <button class="btn primary" onclick="submitCustom('${item.id}')" style="font-size:12px;padding:5px 12px;">确认自定义答案</button>
            <button class="btn ghost" onclick="cancelCustom('${item.id}')" style="font-size:12px;padding:5px 12px;">取消</button>
          </div>
        </div>
      </div>`;
    }
  }
  main.innerHTML = html;

  // 恢复所有卡片 UI
  for (const sec of SECTIONS) {
    for (const item of sec.items) {
      refreshCardUI(item.id);
    }
  }
}

function refreshCardUI(itemId) {
  const ans = getAnswer(itemId);
  const card = document.getElementById('card-' + itemId);
  const pillAgree = document.getElementById('pill-agree-' + itemId);
  const pillDisagree = document.getElementById('pill-disagree-' + itemId);
  const customDiv = document.getElementById('custom-' + itemId);
  const ta = document.getElementById('ta-' + itemId);

  if (!card) return;

  // reset classes
  card.classList.remove('answered-agree', 'answered-disagree');
  if (pillAgree) pillAgree.classList.remove('selected-agree');
  if (pillDisagree) pillDisagree.classList.remove('selected-disagree');

  if (!ans) {
    // 未回答
    if (customDiv) customDiv.classList.remove('show');
  } else if (ans.type === 'agree') {
    card.classList.add('answered-agree');
    if (pillAgree) pillAgree.classList.add('selected-agree');
    if (customDiv) customDiv.classList.remove('show');
  } else if (ans.type === 'disagree') {
    card.classList.add('answered-disagree');
    if (pillDisagree) pillDisagree.classList.add('selected-disagree');
    if (customDiv) customDiv.classList.remove('show');
    if (ta) ta.value = ans.custom || '';
  }
}

function showCustom(itemId) {
  const customDiv = document.getElementById('custom-' + itemId);
  const ta = document.getElementById('ta-' + itemId);
  if (customDiv) {
    customDiv.classList.add('show');
    const ans = getAnswer(itemId);
    if (ta && ans && ans.type === 'disagree') ta.value = ans.custom || '';
    if (ta) setTimeout(() => ta.focus(), 50);
  }
}

function cancelCustom(itemId) {
  const customDiv = document.getElementById('custom-' + itemId);
  const ans = getAnswer(itemId);
  if (customDiv) customDiv.classList.remove('show');
  // 如果之前已经是 disagree 状态，保持
  if (!ans || ans.type !== 'disagree') {
    // 没有保存过 disagree，恢复原状
    refreshCardUI(itemId);
  }
}

function onCustomInput(itemId) {
  // 实时保存草稿（仅更新 custom 文本，不改变 type）
  const ta = document.getElementById('ta-' + itemId);
  const ans = getAnswer(itemId);
  if (ans && ans.type === 'disagree' && ta) {
    answers[itemId].custom = ta.value;
    saveAnswers();
  }
}

function submitCustom(itemId) {
  const ta = document.getElementById('ta-' + itemId);
  const text = ta ? ta.value.trim() : '';
  if (!text) {
    toast('请填写你的答案');
    return;
  }
  setAnswer(itemId, 'disagree', text);
  toast('已保存 ✓');
}

// ── 统计 ──
function updateStats() {
  let total = 0, agree = 0, disagree = 0, pending = 0;
  for (const sec of SECTIONS) {
    for (const item of sec.items) {
      total++;
      const ans = getAnswer(item.id);
      if (!ans) pending++;
      else if (ans.type === 'agree') agree++;
      else if (ans.type === 'disagree') disagree++;
    }
  }
  document.getElementById('count-total').textContent = total;
  document.getElementById('count-agree').textContent = agree;
  document.getElementById('count-disagree').textContent = disagree;
  document.getElementById('count-pending').textContent = pending;
  document.getElementById('progress-label').textContent = `${agree + disagree}/${total} 已审核`;

  // 更新侧边栏 badge
  buildSidebar();
}

// ── 导出 / 导入 ──
function exportAnswers() {
  const data = {
    exportedAt: new Date().toISOString(),
    version: '2.0-rule-review',
    answers,
  };
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `clapclap-rule-review-${new Date().toISOString().slice(0,10)}.json`;
  a.click();
  URL.revokeObjectURL(url);
  toast('已导出 JSON');
}

function importAnswers() {
  const input = document.createElement('input');
  input.type = 'file';
  input.accept = '.json';
  input.onchange = (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (ev) => {
      try {
        const data = JSON.parse(ev.target.result);
        if (!data.answers || typeof data.answers !== 'object') throw new Error('格式不正确');
        answers = data.answers;
        saveAnswers();
        buildMain();
        updateStats();
        toast('已导入 ' + Object.keys(answers).length + ' 条答案');
      } catch (err) {
        toast('导入失败：' + err.message);
      }
    };
    reader.readAsText(file);
  };
  input.click();
}

function resetAll() {
  if (!confirm('确定要清除所有回答吗？此操作不可恢复。')) return;
  answers = {};
  saveAnswers();
  buildMain();
  updateStats();
  toast('已重置');
}

// ── Toast ──
let toastTimer;
function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 1800);
}

// ── 侧边栏高亮 ──
function onScroll() {
  const cats = document.querySelectorAll('.sidebar .cat');
  const sections = SECTIONS.map(s => document.getElementById('sec-' + s.id)).filter(Boolean);
  let current = sections[0]?.id;
  for (const sec of sections) {
    const rect = sec.getBoundingClientRect();
    if (rect.top <= 120) current = sec.id;
  }
  cats.forEach(c => {
    c.classList.toggle('active', c.getAttribute('href') === '#sec-' + current);
  });
}

// ── 快捷键 ──
document.addEventListener('keydown', (e) => {
  if ((e.ctrlKey || e.metaKey) && e.key === 's') {
    e.preventDefault();
    saveAnswers();
    toast('已保存到本地 ✓');
  }
});

// ── 初始化 ──
loadAnswers();
buildSidebar();
buildMain();
updateStats();
window.addEventListener('scroll', onScroll, { passive: true });
</script>
</body>
</html>
