<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ClapClap 联机匹配</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/match.css') }}" />
</head>
<body>
    <script>
        const SERVER_BOOT_ID = "{{ server_boot_id }}";
    </script>
    <div class="container">
        <div class="top-row">
            <h1>双人联机对战</h1>
            <a class="back-link" href="/">返回模式大厅</a>
        </div>

        <div class="card">
            <h2>开始匹配</h2>
            <p>输入昵称后加入匹配队列。当另一位玩家也加入时，系统会自动为你们创建房间并跳转。</p>

            <input id="player-name" type="text" placeholder="输入你的昵称" />
            <div class="action-row">
                <button id="join-match-btn">开始匹配</button>
                <button id="cancel-match-btn" style="display: none; background: #ef4444;">取消匹配</button>
                <button id="resume-room-btn" style="display: none; background: #16a34a;">回到房间</button>
            </div>
            <div class="message" id="match-message"></div>

            <div class="resume-panel" id="resume-panel">
                <div class="resume-title">已找到可继续的房间</div>
                <div class="resume-meta">
                    <div class="resume-meta-item">房间号：<strong id="resume-room-id">-</strong></div>
                    <div class="resume-meta-item">座位：<strong id="resume-seat">-</strong></div>
                    <div class="resume-meta-item">对手：<strong id="resume-opponent">-</strong></div>
                </div>
                <div class="resume-actions">
                    <button id="resume-continue-btn" type="button" style="background: #16a34a;">继续游戏</button>
                    <button id="resume-forget-btn" type="button" style="background: #6b7280;">放弃入口</button>
                </div>
            </div>

            <div class="status-box">
                <div class="status-line"><strong>当前队列状态：</strong></div>
                <div class="status-line" id="queue-status">加载中</div>
                <div class="status-line muted" id="self-status">你当前尚未加入匹配队列。</div>
            </div>
        </div>
    </div>

    <script>
        window.SERVER_BOOT_ID = "{{ server_boot_id }}";
    </script>
    <script src="{{ url_for('static', filename='js/lib/socket.io.min.js') }}"></script>
    <script>
        if (typeof io !== "function") {
            document.write('<script src="https://cdn.socket.io/4.7.5/socket.io.min.js"><\/script>');
        }
    </script>
    <script src="{{ url_for('static', filename='js/core/storage.js') }}"></script>
    <script src="{{ url_for('static', filename='js/core/message.js') }}"></script>
    <script src="{{ url_for('static', filename='js/core/api.js') }}"></script>
    <script src="{{ url_for('static', filename='js/core/modal.js') }}"></script>
    <script src="{{ url_for('static', filename='js/core/boot.js') }}"></script>
    <script src="{{ url_for('static', filename='js/online/room_identity.js') }}"></script>
    <script src="{{ url_for('static', filename='js/online/resume_room.js') }}"></script>
    <script src="{{ url_for('static', filename='js/online/match_state.js') }}"></script>
    <script src="{{ url_for('static', filename='js/pages/match_page.js') }}"></script>
    <script>if (typeof window.initMatchPage === "function") { window.initMatchPage(); }</script>

    <div class="modal-mask" id="global-modal-mask">
        <div class="modal-card" id="global-modal-card">
            <div class="modal-icon" id="global-modal-icon" style="display: none;"></div>
            <div class="modal-title" id="global-modal-title"></div>
            <div class="modal-body" id="global-modal-body"></div>
            <div class="modal-actions" id="global-modal-actions"></div>
        </div>
    </div>

</body>
</html>
