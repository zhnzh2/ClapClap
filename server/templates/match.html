<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ClapClap 联机匹配</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, "Microsoft YaHei", sans-serif;
            background: #f4f6fb;
            color: #1f2937;
        }

        .container {
            max-width: 820px;
            margin: 0 auto;
            padding: 40px 18px;
        }

        .top-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
            margin-bottom: 18px;
        }

        .back-link {
            text-decoration: none;
            background: #6b7280;
            color: white;
            padding: 10px 14px;
            border-radius: 12px;
            font-weight: bold;
        }

        .card {
            background: white;
            border-radius: 18px;
            padding: 24px;
            box-shadow: 0 4px 14px rgba(0,0,0,0.08);
        }

        h1, h2 {
            margin-top: 0;
        }

        p {
            line-height: 1.8;
            color: #374151;
        }

        input {
            width: 100%;
            padding: 11px 12px;
            border-radius: 12px;
            border: 1px solid #d1d5db;
            margin-bottom: 12px;
            box-sizing: border-box;
            font-size: 15px;
        }

        button {
            border: none;
            border-radius: 12px;
            padding: 11px 16px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            background: #2563eb;
            color: white;
        }

        .status-box {
            margin-top: 18px;
            background: #f9fafb;
            border: 1px solid #e5e7eb;
            border-radius: 14px;
            padding: 16px;
        }

        .status-line {
            margin-bottom: 8px;
            line-height: 1.8;
        }

        .message {
            margin-top: 14px;
            min-height: 22px;
            padding: 12px 14px;
            border-radius: 12px;
            border: 1px solid transparent;
            background: #f8fafc;
            color: #374151;
            line-height: 1.7;
            white-space: pre-line;
        }

        .message:empty {
            display: none;
        }

        .message.info {
            background: #eff6ff;
            color: #1d4ed8;
            border-color: #bfdbfe;
        }

        .message.success {
            background: #ecfdf5;
            color: #166534;
            border-color: #86efac;
        }

        .message.waiting {
            background: #fffbeb;
            color: #92400e;
            border-color: #fcd34d;
        }

        .message.error {
            background: #fef2f2;
            color: #991b1b;
            border-color: #fca5a5;
        }

        .muted {
            color: #6b7280;
        }
        
        .action-row {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        
        .modal-mask {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(15, 23, 42, 0.34);
            z-index: 999;
            align-items: center;
            justify-content: center;
        }

        .modal-mask.show {
            display: flex;
        }

        .modal-card {
            width: min(480px, calc(100vw - 32px));
            background: white;
            border: 1px solid #dbe2ea;
            border-radius: 22px;
            box-shadow: 0 24px 60px rgba(15, 23, 42, 0.20);
            padding: 24px 20px;
        }

        @keyframes pop-in {
            from {
                opacity: 0;
                transform: scale(0.94) translateY(8px);
            }
            to {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
        }

        @media (max-width: 640px) {
            .container {
                padding: 20px 12px;
            }

            .card {
                padding: 18px 14px;
                border-radius: 16px;
            }

            .top-row h1 {
                font-size: 24px;
                margin-bottom: 0;
            }

            .action-row {
                display: grid;
                grid-template-columns: 1fr;
                gap: 8px;
            }

            .action-row button {
                width: 100%;
            }

            .match-success-card {
                padding: 22px 16px;
            }

            .match-success-title {
                font-size: 22px;
            }

            .match-success-subtitle {
                font-size: 14px;
            }

            .match-success-countdown {
                font-size: 14px;
            }
        }

        .modal-mask {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(15, 23, 42, 0.34);
            z-index: 999;
            align-items: center;
            justify-content: center;
        }

        .modal-mask.show {
            display: flex;
        }

        .modal-card {
            width: min(480px, calc(100vw - 32px));
            background: white;
            border: 1px solid #dbe2ea;
            border-radius: 22px;
            box-shadow: 0 24px 60px rgba(15, 23, 42, 0.20);
            padding: 24px 20px;
            text-align: center;
        }

        .modal-icon {
            width: 64px;
            height: 64px;
            margin: 0 auto 14px;
            border-radius: 999px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            font-weight: bold;
        }

        .modal-icon.info {
            background: linear-gradient(135deg, #dbeafe, #e0f2fe);
            color: #1d4ed8;
        }

        .modal-icon.success {
            background: linear-gradient(135deg, #dbeafe, #dcfce7);
            color: #166534;
        }

        .modal-icon.warning {
            background: linear-gradient(135deg, #fef3c7, #fee2e2);
            color: #92400e;
        }

        .modal-title {
            font-size: 22px;
            font-weight: bold;
            margin-bottom: 12px;
            color: #111827;
        }

        .modal-body {
            color: #4b5563;
            line-height: 1.8;
            font-size: 14px;
        }

        .modal-actions {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-top: 18px;
            flex-wrap: wrap;
        }

        .modal-actions button {
            border: none;
            border-radius: 12px;
            padding: 11px 16px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
        }

        .modal-actions .primary {
            background: #2563eb;
            color: white;
        }

        .modal-actions .secondary {
            background: #6b7280;
            color: white;
        }

        .modal-actions .danger {
            background: #ef4444;
            color: white;
        }

        @media (max-width: 540px) {
            .modal-card {
                width: min(100vw - 20px, 520px);
                padding: 18px 14px;
                border-radius: 18px;
            }

            .modal-title {
                font-size: 20px;
            }

            .modal-body {
                font-size: 13px;
                line-height: 1.7;
            }

            .modal-actions {
                flex-direction: column;
            }

            .modal-actions button {
                width: 100%;
            }
        }

    </style>
</head>
<body>
    <script>
        const SERVER_BOOT_ID = "{{ server_boot_id }}";
    </script>
    <div class="container">
        <div class="top-row">
            <h1>双人联机对战</h1>
            <a class="back-link" href="/">返回模式大厅</a>
        </div>

        <div class="card">
            <h2>开始匹配</h2>
            <p>输入昵称后加入匹配队列。当另一位玩家也加入时，系统会自动为你们创建房间并跳转。</p>

            <input id="player-name" type="text" placeholder="输入你的昵称" />
            <div class="action-row">
                <button id="join-match-btn">开始匹配</button>
                <button id="cancel-match-btn" style="display: none; background: #ef4444;">取消匹配</button>
                <button id="resume-room-btn" style="display: none; background: #16a34a;">回到房间</button>
            </div>
            <div class="message" id="match-message"></div>

            <div class="status-box">
                <div class="status-line"><strong>当前队列状态：</strong></div>
                <div class="status-line" id="queue-status">加载中</div>
                <div class="status-line muted" id="self-status">你当前尚未加入匹配队列。</div>
            </div>
        </div>
    </div>

    <script>
        window.SERVER_BOOT_ID = "{{ server_boot_id }}";
    </script>
    <script src="{{ url_for('static', filename='js/core/storage_keys.js') }}"></script>
    <script src="{{ url_for('static', filename='js/core/storage.js') }}"></script>
    <script src="{{ url_for('static', filename='js/core/message.js') }}"></script>
    <script src="{{ url_for('static', filename='js/core/api.js') }}"></script>
    <script src="{{ url_for('static', filename='js/core/modal.js') }}"></script>
    <script src="{{ url_for('static', filename='js/core/boot.js') }}"></script>
    <script src="{{ url_for('static', filename='js/online/room_identity.js') }}"></script>
    <script src="{{ url_for('static', filename='js/online/resume_room.js') }}"></script>
    <script src="{{ url_for('static', filename='js/online/match_state.js') }}"></script>
    <script src="{{ url_for('static', filename='js/pages/match_page.js') }}"></script>
    <script src="{{ url_for('static', filename='js/match.js') }}"></script>

    <div class="modal-mask" id="global-modal-mask">
        <div class="modal-card" id="global-modal-card">
            <div class="modal-icon" id="global-modal-icon" style="display: none;"></div>
            <div class="modal-title" id="global-modal-title"></div>
            <div class="modal-body" id="global-modal-body"></div>
            <div class="modal-actions" id="global-modal-actions"></div>
        </div>
    </div>

</body>
</html>
