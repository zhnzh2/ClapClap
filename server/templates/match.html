<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ClapClap 联机匹配</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, "Microsoft YaHei", sans-serif;
            background: #f4f6fb;
            color: #1f2937;
        }

        .container {
            max-width: 820px;
            margin: 0 auto;
            padding: 40px 18px;
        }

        .top-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
            margin-bottom: 18px;
        }

        .back-link {
            text-decoration: none;
            background: #6b7280;
            color: white;
            padding: 10px 14px;
            border-radius: 12px;
            font-weight: bold;
        }

        .card {
            background: white;
            border-radius: 18px;
            padding: 24px;
            box-shadow: 0 4px 14px rgba(0,0,0,0.08);
        }

        h1, h2 {
            margin-top: 0;
        }

        p {
            line-height: 1.8;
            color: #374151;
        }

        input {
            width: 100%;
            padding: 11px 12px;
            border-radius: 12px;
            border: 1px solid #d1d5db;
            margin-bottom: 12px;
            box-sizing: border-box;
            font-size: 15px;
        }

        button {
            border: none;
            border-radius: 12px;
            padding: 11px 16px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            background: #2563eb;
            color: white;
        }

        .status-box {
            margin-top: 18px;
            background: #f9fafb;
            border: 1px solid #e5e7eb;
            border-radius: 14px;
            padding: 16px;
        }

        .status-line {
            margin-bottom: 8px;
            line-height: 1.8;
        }

        .message {
            margin-top: 12px;
            min-height: 22px;
            color: #374151;
        }

        .muted {
            color: #6b7280;
        }

        .match-success-mask {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(15, 23, 42, 0.30);
            z-index: 999;
            align-items: center;
            justify-content: center;
        }

        .match-success-mask.show {
            display: flex;
        }

        .match-success-card {
            width: min(420px, calc(100vw - 32px));
            background: white;
            border-radius: 22px;
            padding: 28px 24px;
            border: 1px solid #dbe2ea;
            box-shadow: 0 24px 60px rgba(15, 23, 42, 0.20);
            text-align: center;
            animation: pop-in 0.28s ease;
        }

        .match-success-icon {
            width: 68px;
            height: 68px;
            margin: 0 auto 14px;
            border-radius: 999px;
            background: linear-gradient(135deg, #dbeafe, #dcfce7);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 30px;
        }

        .match-success-title {
            font-size: 24px;
            font-weight: bold;
            color: #111827;
            margin-bottom: 8px;
        }

        .match-success-subtitle {
            color: #4b5563;
            line-height: 1.7;
            margin-bottom: 14px;
        }

        .match-success-meta {
            display: flex;
            justify-content: center;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 12px;
        }

        .match-meta-chip {
            padding: 6px 10px;
            border-radius: 999px;
            background: #f3f4f6;
            color: #374151;
            font-size: 13px;
            font-weight: bold;
        }

        .match-success-countdown {
            color: #2563eb;
            font-weight: bold;
        }

        @keyframes pop-in {
            from {
                opacity: 0;
                transform: scale(0.94) translateY(8px);
            }
            to {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="top-row">
            <h1>双人联机对战</h1>
            <a class="back-link" href="/">返回模式大厅</a>
        </div>

        <div class="card">
            <h2>开始匹配</h2>
            <p>输入昵称后加入匹配队列。当另一位玩家也加入时，系统会自动为你们创建房间并跳转。</p>

            <input id="player-name" type="text" placeholder="输入你的昵称" />
            <button id="join-match-btn">开始匹配</button>
            <button id="cancel-match-btn" style="display: none; margin-left: 8px; background: #ef4444;">取消匹配</button>
            <button id="resume-room-btn" style="display: none; margin-left: 8px; background: #16a34a;">回到房间</button>

            <div class="message" id="match-message"></div>

            <div class="status-box">
                <div class="status-line"><strong>当前队列状态：</strong></div>
                <div class="status-line" id="queue-status">加载中</div>
                <div class="status-line muted" id="self-status">你当前尚未加入匹配队列。</div>
            </div>
        </div>
    </div>

    <script>
        let joinedQueue = false;
        let matchedRoomId = null;
        let currentPlayerName = "";
        let currentMatchToken = "";
        let currentRoomPlayerToken = "";
        let currentSeat = null;

        function ensureMatchIdentity(playerName) {
            const raw = localStorage.getItem("clapclap_match_identity");
            if (raw) {
                try {
                    const parsed = JSON.parse(raw);
                    if (parsed.player_name === playerName && parsed.player_token) {
                        return parsed.player_token;
                    }
                } catch (error) {
                    console.error(error);
                }
            }

            const token = crypto.randomUUID().replaceAll("-", "");
            localStorage.setItem(
                "clapclap_match_identity",
                JSON.stringify({
                    player_name: playerName,
                    player_token: token
                })
            );
            return token;
        }

        function saveRoomIdentity(roomId, playerToken, seat) {
            localStorage.setItem(
                `clapclap_room_${roomId}`,
                JSON.stringify({
                    player_token: playerToken,
                    seat: seat
                })
            );
        }

        function setJoiningUi(isJoining) {
            document.getElementById("join-match-btn").disabled = isJoining;
        }

        function setQueuedUi(isQueued) {
            document.getElementById("cancel-match-btn").style.display = isQueued ? "" : "none";
        }

        function setResumeUi(showResume) {
            document.getElementById("resume-room-btn").style.display = showResume ? "" : "none";
        }

        function goToMatchedRoom() {
            if (!matchedRoomId || !currentSeat || !currentRoomPlayerToken) {
                return;
            }

            saveRoomIdentity(matchedRoomId, currentRoomPlayerToken, currentSeat);
            window.location.href = `/room/${matchedRoomId}`;
        }

        function showMatchedTransition(opponentName, seat) {
            document.getElementById("matched-opponent-chip").textContent =
                `对手：${opponentName || "已匹配玩家"}`;
            document.getElementById("matched-seat-chip").textContent =
                `座位：${(seat || "").toUpperCase()}`;
            document.getElementById("match-success-subtitle").textContent =
                "已完成匹配，正在同步房间身份、恢复座位并连接对局……";
            document.getElementById("match-success-countdown").textContent =
                "1 秒后自动进入房间……";
            document.getElementById("match-success-mask").classList.add("show");
        }

        function hideMatchedTransition() {
            document.getElementById("match-success-mask").classList.remove("show");
        }

        function getOpponentNameFromMatchedData(data) {
            if (data.seat === "p1") {
                return data.p2_name || "";
            }
            if (data.seat === "p2") {
                return data.p1_name || "";
            }
            return "";
        }

        function getOpponentNameFromState(state) {
            return state.opponent_name || "";
        }

        function delayedGoToMatchedRoom(opponentName, seat) {
            showMatchedTransition(opponentName, seat);

            window.setTimeout(() => {
                goToMatchedRoom();
            }, 1000);
        }

        async function joinMatchQueue() {
            const playerName = document.getElementById("player-name").value.trim();
            const msg = document.getElementById("match-message");
            const selfStatus = document.getElementById("self-status");

            if (!playerName) {
                msg.textContent = "请先输入昵称。";
                return;
            }
            currentMatchToken = ensureMatchIdentity(playerName);

            try {
                const res = await fetch("/api/match/join", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        player_name: playerName,
                        player_token: currentMatchToken
                    })
                });

                const data = await res.json();

                if (!res.ok || !data.ok) {
                    msg.textContent = data.error || "加入匹配失败。";
                    return;
                }

                if (data.matched) {
                    matchedRoomId = data.room_id;
                    currentSeat = data.seat;
                    currentRoomPlayerToken = data.room_player_token || "";

                    if (!currentRoomPlayerToken) {
                        msg.textContent = "匹配成功，但服务端没有返回 room_player_token。";
                        return;
                    }

                    saveRoomIdentity(data.room_id, currentRoomPlayerToken, currentSeat);

                    const opponentName = getOpponentNameFromMatchedData(data);

                    msg.textContent = data.message || "匹配成功，正在进入房间……";
                    selfStatus.textContent = "你已匹配成功，正在准备进入房间。";
                    setQueuedUi(false);
                    setResumeUi(true);

                    delayedGoToMatchedRoom(opponentName, currentSeat);
                    return;
                }

                joinedQueue = true;
                msg.textContent = data.already_queued
                    ? "你已经在匹配队列中，请等待另一位玩家。"
                    : (data.message || "已进入匹配队列。");
                selfStatus.textContent = "你已在匹配队列中，正在等待另一位玩家。";
                setQueuedUi(true);
                setResumeUi(false);
            } catch (error) {
                msg.textContent = "加入匹配失败：" + error;
            }
        }

        async function fetchMatchStatus() {
            if (matchedRoomId) {
                return;
            }

            try {
                const res = await fetch("/api/match/status");
                const data = await res.json();

                if (!res.ok || !data.ok) {
                    document.getElementById("queue-status").textContent = "匹配状态获取失败。";
                    return;
                }

                const status = data.status;

                if (status.has_waiting_player) {
                    document.getElementById("queue-status").textContent =
                        `当前有玩家正在等待：${status.waiting_player}`;
                } else {
                    document.getElementById("queue-status").textContent =
                        "当前没有玩家在等待。";
                }
            } catch (error) {
                document.getElementById("queue-status").textContent =
                    "匹配状态获取失败：" + error;
            }
        }

        async function syncMyMatchState() {
            if (!currentMatchToken) {
                return;
            }

            try {
                const res = await fetch(
                    `/api/match/me?player_token=${encodeURIComponent(currentMatchToken)}`
                );
                const data = await res.json();

                if (!res.ok || !data.ok) {
                    return;
                }

                const state = data.state;

                if (state.status === "matched" && state.room_id && state.seat) {
                    joinedQueue = false;
                    matchedRoomId = state.room_id;
                    currentSeat = state.seat;
                    currentRoomPlayerToken = state.room_player_token || "";

                    if (!currentRoomPlayerToken) {
                        document.getElementById("match-message").textContent =
                            "你已匹配到房间，但缺少 room_player_token，暂时无法恢复。";
                        return;
                    }

                    saveRoomIdentity(state.room_id, currentRoomPlayerToken, state.seat);

                    document.getElementById("match-message").textContent =
                        "你已经匹配到房间，正在为你恢复对局入口……";
                    document.getElementById("self-status").textContent =
                        `你已匹配成功，座位为 ${state.seat.toUpperCase()}。`;

                    setQueuedUi(false);
                    setResumeUi(true);

                    delayedGoToMatchedRoom(getOpponentNameFromState(state), state.seat);
                    return;
                }

                if (state.status === "queued") {
                    joinedQueue = true;
                    document.getElementById("self-status").textContent =
                        "你已在匹配队列中，正在等待另一位玩家。";
                    setQueuedUi(true);
                    setResumeUi(false);
                    return;
                }

                joinedQueue = false;
                setQueuedUi(false);
            } catch (error) {
                console.error("syncMyMatchState error:", error);
            }
        }

        async function cancelMyMatch() {
            if (!currentPlayerToken) {
                return;
            }

            try {
                const res = await fetch("/api/match/cancel", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        player_token: currentPlayerToken
                    })
                });

                const data = await res.json();

                if (!res.ok || !data.ok) {
                    document.getElementById("match-message").textContent =
                        data.error || "取消匹配失败。";
                    return;
                }

                joinedQueue = false;
                matchedRoomId = null;
                currentSeat = null;

                document.getElementById("match-message").textContent =
                    data.message || "已取消匹配。";
                document.getElementById("self-status").textContent =
                    "你当前尚未加入匹配队列。";

                setQueuedUi(false);
                setResumeUi(false);
            } catch (error) {
                document.getElementById("match-message").textContent =
                    "取消匹配失败：" + error;
            }
        }

        async function fetchMyMatchResult() {
            if (!joinedQueue || matchedRoomId || !currentPlayerName) {
                return;
            }

            try {
                const res = await fetch(
                    `/api/match/result?player_token=${encodeURIComponent(currentPlayerToken)}`
                );
                const data = await res.json();

                if (!res.ok || !data.ok) {
                    return;
                }

                if (data.matched && data.room_id) {
                    matchedRoomId = data.room_id;
                    saveRoomIdentity(data.room_id, data.player_token, data.seat);
                    document.getElementById("match-message").textContent =
                        "匹配成功，正在跳转房间……";
                    window.location.href = `/room/${data.room_id}`;
                }
            } catch (error) {
                console.error("fetchMyMatchResult error:", error);
            }
        }

        document.getElementById("join-match-btn").addEventListener("click", joinMatchQueue);
        document.getElementById("cancel-match-btn").addEventListener("click", cancelMyMatch);
        document.getElementById("resume-room-btn").addEventListener("click", goToMatchedRoom);

        const savedIdentityRaw = localStorage.getItem("clapclap_match_identity");
        if (savedIdentityRaw) {
            try {
                const savedIdentity = JSON.parse(savedIdentityRaw);
                currentPlayerName = savedIdentity.player_name || "";
                currentMatchToken = savedIdentity.player_token || "";
                if (currentPlayerName) {
                    document.getElementById("player-name").value = currentPlayerName;
                }
            } catch (error) {
                console.error(error);
            }
        }

        fetchMatchStatus();
        syncMyMatchState();

        setInterval(() => {
            fetchMatchStatus();
            syncMyMatchState();
        }, 3000);
    </script>

    <div class="match-success-mask" id="match-success-mask">
        <div class="match-success-card">
            <div class="match-success-icon">✓</div>
            <div class="match-success-title">匹配成功</div>
            <div class="match-success-subtitle" id="match-success-subtitle">
                正在为你连接房间……
            </div>
            <div class="match-success-meta">
                <span class="match-meta-chip" id="matched-opponent-chip">对手：加载中</span>
                <span class="match-meta-chip" id="matched-seat-chip">座位：加载中</span>
            </div>
            <div class="match-success-countdown" id="match-success-countdown">
                1 秒后自动进入房间……
            </div>
        </div>
    </div>

</body>
</html>
