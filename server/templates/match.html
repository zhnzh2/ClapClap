<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ClapClap 联机匹配</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, "Microsoft YaHei", sans-serif;
            background: #f4f6fb;
            color: #1f2937;
        }

        .container {
            max-width: 820px;
            margin: 0 auto;
            padding: 40px 18px;
        }

        .top-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
            margin-bottom: 18px;
        }

        .back-link {
            text-decoration: none;
            background: #6b7280;
            color: white;
            padding: 10px 14px;
            border-radius: 12px;
            font-weight: bold;
        }

        .card {
            background: white;
            border-radius: 18px;
            padding: 24px;
            box-shadow: 0 4px 14px rgba(0,0,0,0.08);
        }

        h1, h2 {
            margin-top: 0;
        }

        p {
            line-height: 1.8;
            color: #374151;
        }

        input {
            width: 100%;
            padding: 11px 12px;
            border-radius: 12px;
            border: 1px solid #d1d5db;
            margin-bottom: 12px;
            box-sizing: border-box;
            font-size: 15px;
        }

        button {
            border: none;
            border-radius: 12px;
            padding: 11px 16px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            background: #2563eb;
            color: white;
        }

        .status-box {
            margin-top: 18px;
            background: #f9fafb;
            border: 1px solid #e5e7eb;
            border-radius: 14px;
            padding: 16px;
        }

        .status-line {
            margin-bottom: 8px;
            line-height: 1.8;
        }

        .message {
            margin-top: 12px;
            min-height: 22px;
            color: #374151;
        }

        .muted {
            color: #6b7280;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="top-row">
            <h1>双人联机对战</h1>
            <a class="back-link" href="/">返回模式大厅</a>
        </div>

        <div class="card">
            <h2>开始匹配</h2>
            <p>输入昵称后加入匹配队列。当另一位玩家也加入时，系统会自动为你们创建房间并跳转。</p>

            <input id="player-name" type="text" placeholder="输入你的昵称" />
            <button id="join-match-btn">开始匹配</button>

            <div class="message" id="match-message"></div>

            <div class="status-box">
                <div class="status-line"><strong>当前队列状态：</strong></div>
                <div class="status-line" id="queue-status">加载中</div>
                <div class="status-line muted" id="self-status">你当前尚未加入匹配队列。</div>
            </div>
        </div>
    </div>

    <script>
        let joinedQueue = false;
        let matchedRoomId = null;
        let currentPlayerName = "";
        let currentPlayerToken = "";

        function ensureMatchIdentity(playerName) {
            const raw = localStorage.getItem("clapclap_match_identity");
            if (raw) {
                try {
                    const parsed = JSON.parse(raw);
                    if (parsed.player_name === playerName && parsed.player_token) {
                        return parsed.player_token;
                    }
                } catch (error) {
                    console.error(error);
                }
            }

            const token = crypto.randomUUID().replaceAll("-", "");
            localStorage.setItem(
                "clapclap_match_identity",
                JSON.stringify({
                    player_name: playerName,
                    player_token: token
                })
            );
            return token;
        }

        function saveRoomIdentity(roomId, playerToken, seat) {
            localStorage.setItem(
                `clapclap_room_${roomId}`,
                JSON.stringify({
                    player_token: playerToken,
                    seat: seat
                })
            );
        }

        async function joinMatchQueue() {
            const playerName = document.getElementById("player-name").value.trim();
            const msg = document.getElementById("match-message");
            const selfStatus = document.getElementById("self-status");

            if (!playerName) {
                msg.textContent = "请先输入昵称。";
                return;
            }
            currentPlayerToken = ensureMatchIdentity(playerName);

            try {
                const res = await fetch("/api/match/join", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        player_name: playerName,
                        player_token: currentPlayerToken
                    })
                });

                const data = await res.json();

                if (!res.ok || !data.ok) {
                    msg.textContent = data.error || "加入匹配失败。";
                    return;
                }

                if (data.matched) {
                    matchedRoomId = data.room_id;
                    saveRoomIdentity(data.room_id, data.player_token, data.seat);
                    msg.textContent = "匹配成功，正在跳转房间……";
                    window.location.href = `/room/${data.room_id}`;
                    return;
                }

                joinedQueue = true;
                msg.textContent = data.message || "已进入匹配队列。";
                selfStatus.textContent = "你已在匹配队列中，正在等待另一位玩家。";
            } catch (error) {
                msg.textContent = "加入匹配失败：" + error;
            }
        }

        async function fetchMatchStatus() {
            if (matchedRoomId) {
                return;
            }

            try {
                const res = await fetch("/api/match/status");
                const data = await res.json();

                if (!res.ok || !data.ok) {
                    document.getElementById("queue-status").textContent = "匹配状态获取失败。";
                    return;
                }

                const status = data.status;

                if (status.has_waiting_player) {
                    document.getElementById("queue-status").textContent =
                        `当前有玩家正在等待：${status.waiting_player}`;
                } else {
                    document.getElementById("queue-status").textContent =
                        "当前没有玩家在等待。";
                }
            } catch (error) {
                document.getElementById("queue-status").textContent =
                    "匹配状态获取失败：" + error;
            }
        }

        async function fetchMyMatchResult() {
            if (!joinedQueue || matchedRoomId || !currentPlayerName) {
                return;
            }

            try {
                const res = await fetch(
                    `/api/match/result?player_token=${encodeURIComponent(currentPlayerToken)}`
                );
                const data = await res.json();

                if (!res.ok || !data.ok) {
                    return;
                }

                if (data.matched && data.room_id) {
                    matchedRoomId = data.room_id;
                    saveRoomIdentity(data.room_id, data.player_token, data.seat);
                    document.getElementById("match-message").textContent =
                        "匹配成功，正在跳转房间……";
                    window.location.href = `/room/${data.room_id}`;
                }
            } catch (error) {
                console.error("fetchMyMatchResult error:", error);
            }
        }

        document.getElementById("join-match-btn").addEventListener("click", joinMatchQueue);

        fetchMatchStatus();
        fetchMyMatchResult();

        setInterval(() => {
            fetchMatchStatus();
            fetchMyMatchResult();
        }, 3000);
    </script>
</body>
</html>
