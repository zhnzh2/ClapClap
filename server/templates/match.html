<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ClapClap 联机匹配</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, "Microsoft YaHei", sans-serif;
            background: #f4f6fb;
            color: #1f2937;
        }

        .container {
            max-width: 820px;
            margin: 0 auto;
            padding: 40px 18px;
        }

        .top-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
            margin-bottom: 18px;
        }

        .back-link {
            text-decoration: none;
            background: #6b7280;
            color: white;
            padding: 10px 14px;
            border-radius: 12px;
            font-weight: bold;
        }

        .card {
            background: white;
            border-radius: 18px;
            padding: 24px;
            box-shadow: 0 4px 14px rgba(0,0,0,0.08);
        }

        h1, h2 {
            margin-top: 0;
        }

        p {
            line-height: 1.8;
            color: #374151;
        }

        input {
            width: 100%;
            padding: 11px 12px;
            border-radius: 12px;
            border: 1px solid #d1d5db;
            margin-bottom: 12px;
            box-sizing: border-box;
            font-size: 15px;
        }

        button {
            border: none;
            border-radius: 12px;
            padding: 11px 16px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            background: #2563eb;
            color: white;
        }

        .status-box {
            margin-top: 18px;
            background: #f9fafb;
            border: 1px solid #e5e7eb;
            border-radius: 14px;
            padding: 16px;
        }

        .status-line {
            margin-bottom: 8px;
            line-height: 1.8;
        }

        .message {
            margin-top: 12px;
            min-height: 22px;
            color: #374151;
        }

        .muted {
            color: #6b7280;
        }

        .match-success-mask {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(15, 23, 42, 0.30);
            z-index: 999;
            align-items: center;
            justify-content: center;
        }

        .match-success-mask.show {
            display: flex;
        }

        .match-success-card {
            width: min(420px, calc(100vw - 32px));
            background: white;
            border-radius: 22px;
            padding: 28px 24px;
            border: 1px solid #dbe2ea;
            box-shadow: 0 24px 60px rgba(15, 23, 42, 0.20);
            text-align: center;
            animation: pop-in 0.28s ease;
        }

        .match-success-icon {
            width: 68px;
            height: 68px;
            margin: 0 auto 14px;
            border-radius: 999px;
            background: linear-gradient(135deg, #dbeafe, #dcfce7);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 30px;
        }

        .match-success-title {
            font-size: 24px;
            font-weight: bold;
            color: #111827;
            margin-bottom: 8px;
        }

        .match-success-subtitle {
            color: #4b5563;
            line-height: 1.7;
            margin-bottom: 14px;
        }

        .match-success-meta {
            display: flex;
            justify-content: center;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 12px;
        }

        .match-meta-chip {
            padding: 6px 10px;
            border-radius: 999px;
            background: #f3f4f6;
            color: #374151;
            font-size: 13px;
            font-weight: bold;
        }

        .match-success-countdown {
            color: #2563eb;
            font-weight: bold;
        }

        @keyframes pop-in {
            from {
                opacity: 0;
                transform: scale(0.94) translateY(8px);
            }
            to {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="top-row">
            <h1>双人联机对战</h1>
            <a class="back-link" href="/">返回模式大厅</a>
        </div>

        <div class="card">
            <h2>开始匹配</h2>
            <p>输入昵称后加入匹配队列。当另一位玩家也加入时，系统会自动为你们创建房间并跳转。</p>

            <input id="player-name" type="text" placeholder="输入你的昵称" />
            <button id="join-match-btn">开始匹配</button>
            <button id="cancel-match-btn" style="display: none; margin-left: 8px; background: #ef4444;">取消匹配</button>
            <button id="resume-room-btn" style="display: none; margin-left: 8px; background: #16a34a;">回到房间</button>

            <div class="message" id="match-message"></div>

            <div class="status-box">
                <div class="status-line"><strong>当前队列状态：</strong></div>
                <div class="status-line" id="queue-status">加载中</div>
                <div class="status-line muted" id="self-status">你当前尚未加入匹配队列。</div>
            </div>
        </div>
    </div>

    <script src="{{ url_for('static', filename='js/match.js') }}"></script>

    <div class="match-success-mask" id="match-success-mask">
        <div class="match-success-card">
            <div class="match-success-icon">✓</div>
            <div class="match-success-title">匹配成功</div>
            <div class="match-success-subtitle" id="match-success-subtitle">
                正在为你连接房间……
            </div>
            <div class="match-success-meta">
                <span class="match-meta-chip" id="matched-opponent-chip">对手：加载中</span>
                <span class="match-meta-chip" id="matched-seat-chip">座位：加载中</span>
            </div>
            <div class="match-success-countdown" id="match-success-countdown">
                1 秒后自动进入房间……
            </div>
        </div>
    </div>

</body>
</html>
