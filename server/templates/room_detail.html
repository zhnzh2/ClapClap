<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ClapClap 房间对战</title>
    <style>
        :root {
            --bg: #f3f4f8;
            --card: #ffffff;
            --panel: #f8fafc;
            --text: #1f2937;
            --muted: #6b7280;
            --border: #dbe2ea;
            --shadow: 0 6px 18px rgba(15, 23, 42, 0.08);

            --blue: #2563eb;
            --blue-soft: #dbeafe;
            --blue-border: #93c5fd;

            --red: #dc2626;
            --red-soft: #fee2e2;
            --red-border: #fca5a5;

            --green: #16a34a;
            --green-soft: #dcfce7;
            --green-border: #86efac;

            --yellow: #ca8a04;
            --yellow-soft: #fef3c7;
            --yellow-border: #fcd34d;

            --danger: #ef4444;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, "Microsoft YaHei", sans-serif;
            background: var(--bg);
            color: var(--text);
        }

        .container {
            max-width: 1160px;
            margin: 0 auto;
            padding: 24px 16px 40px;
        }

        .top-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
            margin-bottom: 16px;
        }

        .top-actions {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .btn,
        button {
            border: none;
            border-radius: 12px;
            padding: 10px 14px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
        }

        .btn.secondary,
        button.secondary {
            background: #6b7280;
            color: white;
        }

        .btn.primary,
        button.primary {
            background: var(--blue);
            color: white;
        }

        .btn.danger,
        button.danger {
            background: var(--danger);
            color: white;
        }

        .card {
            background: var(--card);
            border-radius: 18px;
            padding: 18px;
            box-shadow: var(--shadow);
            margin-bottom: 16px;
        }

        .card h2 {
            margin-top: 0;
            margin-bottom: 12px;
        }

        .info-grid,
        .player-grid,
        .selection-grid,
        .control-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px;
        }

        .info-box,
        .player-box,
        .selection-box {
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 14px;
        }

        .label {
            font-size: 13px;
            color: var(--muted);
            margin-bottom: 6px;
        }

        .value {
            font-size: 20px;
            font-weight: bold;
        }

        .resource-grid {
            display: grid;
            grid-template-columns: repeat(4, minmax(0, 1fr));
            gap: 8px;
        }

        .resource-item {
            background: white;
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 10px;
            box-shadow: inset 0 1px 0 rgba(255,255,255,0.8);
        }

        .resource-label {
            font-size: 11px;
            color: var(--muted);
            margin-bottom: 4px;
        }

        .resource-value {
            font-size: 18px;
            font-weight: bold;
        }

        .move-group-title {
            margin: 10px 0 6px 0;
            font-size: 13px;
            font-weight: bold;
            color: #4b5563;
        }

        .move-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(90px, 1fr));
            gap: 8px;
        }

        .move-btn {
            border: 1px solid #d1d5db;
            background: white;
            border-radius: 10px;
            padding: 8px 6px;
            cursor: pointer;
            text-align: center;
            min-height: 58px;
            transition: transform 0.12s ease, box-shadow 0.12s ease, border-color 0.12s ease, background 0.12s ease;
        }

        .move-btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 4px 10px rgba(37, 99, 235, 0.12);
        }

        .move-btn.selected-p1 {
            border: 2px solid var(--red);
            background: var(--red-soft);
            color: #991b1b;
            font-weight: bold;
        }

        .move-btn.selected-p2 {
            border: 2px solid var(--blue);
            background: var(--blue-soft);
            color: #1d4ed8;
            font-weight: bold;
        }

        .move-btn.disabled {
            opacity: 0.4;
            cursor: not-allowed;
            background: #f3f4f6;
            box-shadow: none;
            transform: none;
        }

        .move-label {
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 3px;
        }

        .move-name {
            font-size: 10px;
            color: var(--muted);
        }

        .message {
            min-height: 22px;
            margin-top: 10px;
            color: #374151;
        }

        .history-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
            max-height: 280px;
            overflow-y: auto;
        }

        .history-item {
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 12px;
            line-height: 1.7;
        }

        .muted {
            color: var(--muted);
        }

        .seat-p1 {
            background: var(--red-soft);
            border-color: var(--red-border);
        }

        .seat-p2 {
            background: var(--blue-soft);
            border-color: var(--blue-border);
        }

        .status-badge {
            display: inline-block;
            padding: 6px 10px;
            border-radius: 999px;
            font-size: 13px;
            font-weight: bold;
            border: 1px solid transparent;
        }

        .status-waiting {
            background: var(--yellow-soft);
            color: #92400e;
            border-color: var(--yellow-border);
        }

        .status-playing {
            background: var(--green-soft);
            color: #166534;
            border-color: var(--green-border);
        }

        .status-finished {
            background: var(--red-soft);
            color: #991b1b;
            border-color: var(--red-border);
        }

        .pending-highlight {
            border-width: 2px;
            font-size: 22px;
        }

        .pending-ready-p1 {
            background: var(--red-soft);
            border-color: var(--red-border);
        }

        .pending-ready-p2 {
            background: var(--blue-soft);
            border-color: var(--blue-border);
        }

        .message.success {
            color: #166534;
            font-weight: bold;
        }

        .message.waiting {
            color: #92400e;
            font-weight: bold;
        }

        .message.error {
            color: #991b1b;
            font-weight: bold;
        }

        .message.info {
            color: #1d4ed8;
            font-weight: bold;
        }

        .section-note {
            margin-top: 8px;
            font-size: 13px;
            color: var(--muted);
        }

        .player-box.active-seat {
            border-width: 2px;
        }

        .player-box.active-seat-p1 {
            border-color: var(--red-border);
            background: linear-gradient(to bottom, #fff7f7, #fffafa);
        }

        .player-box.active-seat-p2 {
            border-color: var(--blue-border);
            background: linear-gradient(to bottom, #f7fbff, #fafcff);
        }

        @media (max-width: 900px) {
            .info-grid,
            .player-grid,
            .selection-grid,
            .control-grid {
                grid-template-columns: 1fr;
            }

            .resource-grid {
                grid-template-columns: repeat(2, minmax(0, 1fr));
            }
        }

        @media (max-width: 540px) {
            .move-grid {
                grid-template-columns: repeat(2, minmax(0, 1fr));
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="top-row">
            <h1>房间对战</h1>
            <div class="top-actions">
                <a class="btn secondary" href="/rooms">返回房间大厅</a>
                <button class="danger" id="reset-room-btn">重置对局</button>
            </div>
        </div>

        <div class="card">
            <h2>房间信息</h2>
            <div class="info-grid">
                <div class="info-box">
                    <div class="label">房间号</div>
                    <div class="value" id="room-id">{{ room_id }}</div>
                </div>
                <div class="info-box">
                    <div class="label">座位</div>
                    <div class="value" id="my-seat">加载中</div>
                </div>
                <div class="info-box">
                    <div class="label">房间状态</div>
                    <div class="value">
                        <span class="status-badge" id="room-status">加载中</span>
                    </div>
                </div>
                <div class="info-box" id="p1-name-box">
                    <div class="label">P1</div>
                    <div class="value" id="p1-name">加载中</div>
                </div>
                <div class="info-box" id="p2-name-box">
                    <div class="label">P2</div>
                    <div class="value" id="p2-name">加载中</div>
                </div>
            </div>
        </div>

        <div class="card">
            <h2>当前对局状态</h2>
            <div class="player-grid">
                <div class="player-box" id="p1-player-box">
                    <h3>P1 状态</h3>
                    <div id="p1-state" class="resource-grid"></div>
                    <div class="section-note" id="p1-seat-note"></div>
                </div>
                <div class="player-box" id="p2-player-box">
                    <h3>P2 状态</h3>
                    <div id="p2-state" class="resource-grid"></div>
                    <div class="section-note" id="p2-seat-note"></div>
                </div>
            </div>
        </div>

        <div class="card">
            <h2>提交动作</h2>
            <div class="selection-grid">
                <div class="selection-box" id="p1-submit-box">
                    <h3>P1 提交区</h3>
                    <div id="p1-move-groups"></div>
                    <div class="message" id="p1-submit-msg"></div>
                </div>
                <div class="selection-box" id="p2-submit-box">
                    <h3>P2 提交区</h3>
                    <div id="p2-move-groups"></div>
                    <div class="message" id="p2-submit-msg"></div>
                </div>
            </div>

            <div class="control-grid" style="margin-top: 14px;">
                <div class="selection-box" id="pending-p1-box">
                    <div class="label">P1 本回合待提交</div>
                    <div class="value pending-highlight" id="pending-p1">暂无</div>
                </div>
                <div class="selection-box" id="pending-p2-box">
                    <div class="label">P2 本回合待提交</div>
                    <div class="value pending-highlight" id="pending-p2">暂无</div>
                </div>
            </div>

            <div class="message" id="room-message"></div>
        </div>

        <div class="card">
            <h2>历史记录</h2>
            <div id="history" class="history-list"></div>
        </div>
    </div>

    <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
    <script>
        const roomId = "{{ room_id }}";

        function loadRoomIdentity(roomId) {
            const raw = localStorage.getItem(`clapclap_room_${roomId}`);
            if (!raw) {
                return {
                    player_token: "",
                    seat: null
                };
            }

            try {
                const parsed = JSON.parse(raw);
                return {
                    player_token: parsed.player_token || "",
                    seat: parsed.seat || null
                };
            } catch (error) {
                return {
                    player_token: "",
                    seat: null
                };
            }
        }

        const roomIdentity = loadRoomIdentity(roomId);
        let mySeat = roomIdentity.seat;
        let myPlayerToken = roomIdentity.player_token;

        let latestRoom = null;
        const socket = io();

        socket.on("connect", () => {
            socket.emit("join_room", { room_id: roomId });
        });

        socket.on("room_state", (data) => {
            if (!data || !data.ok) {
                return;
            }

            renderRoom(data.room);
            setRoomMessage("房间状态已实时同步。", "info");
        });

        socket.on("room_error", (data) => {
            setRoomMessage(data?.error || "房间实时连接出错。", "error");
        });

        const moveGroups = {
            resource: ["QI", "SHIELD"],
            attack_qi: ["GI", "PO", "LENG_FENG", "RU_LAI", "HEI_DONG"],
            attack_shield: ["FIRE", "SHAN_DIAN", "LIE_YAN", "SHINING"],
            defense: ["SHI_ZI", "BA_GUA"],
            trick: ["CHI", "SHUANG_CHI", "SHAN", "GAO"]
        };

        function seatDisplayText(seat) {
            if (seat === "p1") return "P1";
            if (seat === "p2") return "P2";
            return "观战 / 未知";
        }

        function roomStatusText(status) {
            if (status === "waiting") return "等待中";
            if (status === "playing") return "对战中";
            if (status === "finished") return "已结束";
            return status || "未知";
        }

        function applyRoomStatusBadge(status) {
            const el = document.getElementById("room-status");
            el.textContent = roomStatusText(status);
            el.className = "status-badge";

            if (status === "waiting") {
                el.classList.add("status-waiting");
            } else if (status === "playing") {
                el.classList.add("status-playing");
            } else if (status === "finished") {
                el.classList.add("status-finished");
            }
        }

        function applySeatHighlights() {
            const p1NameBox = document.getElementById("p1-name-box");
            const p2NameBox = document.getElementById("p2-name-box");
            const p1PlayerBox = document.getElementById("p1-player-box");
            const p2PlayerBox = document.getElementById("p2-player-box");

            p1NameBox.classList.remove("seat-p1");
            p2NameBox.classList.remove("seat-p2");
            p1PlayerBox.classList.remove("active-seat", "active-seat-p1");
            p2PlayerBox.classList.remove("active-seat", "active-seat-p2");

            if (mySeat === "p1") {
                p1NameBox.classList.add("seat-p1");
                p1PlayerBox.classList.add("active-seat", "active-seat-p1");
                document.getElementById("p1-seat-note").textContent = "这是你当前操作的一侧。";
                document.getElementById("p2-seat-note").textContent = "这是对方当前状态。";
            } else if (mySeat === "p2") {
                p2NameBox.classList.add("seat-p2");
                p2PlayerBox.classList.add("active-seat", "active-seat-p2");
                document.getElementById("p1-seat-note").textContent = "这是对方当前状态。";
                document.getElementById("p2-seat-note").textContent = "这是你当前操作的一侧。";
            } else {
                document.getElementById("p1-seat-note").textContent = "当前为观战或未知身份。";
                document.getElementById("p2-seat-note").textContent = "当前为观战或未知身份。";
            }
        }

        function applyPendingHighlights(room) {
            const p1Box = document.getElementById("pending-p1-box");
            const p2Box = document.getElementById("pending-p2-box");

            p1Box.classList.remove("pending-ready-p1");
            p2Box.classList.remove("pending-ready-p2");

            if (room.pending_p1_move) {
                p1Box.classList.add("pending-ready-p1");
            }

            if (room.pending_p2_move) {
                p2Box.classList.add("pending-ready-p2");
            }
        }

        function applySeatVisibility() {
            const p1Box = document.getElementById("p1-submit-box");
            const p2Box = document.getElementById("p2-submit-box");

            if (mySeat === "p1") {
                p1Box.style.display = "";
                p2Box.style.display = "none";
            } else if (mySeat === "p2") {
                p1Box.style.display = "none";
                p2Box.style.display = "";
            } else {
                p1Box.style.display = "";
                p2Box.style.display = "";
            }

            document.getElementById("my-seat").textContent = seatDisplayText(mySeat);
        }

        function moveCategoryTitle(key) {
            if (key === "resource") return "资源";
            if (key === "attack_qi") return "气系攻击";
            if (key === "attack_shield") return "盾系攻击";
            if (key === "defense") return "防御";
            if (key === "trick") return "锦囊";
            return "其他";
        }

        function resourceItem(label, value) {
            return `
                <div class="resource-item">
                    <div class="resource-label">${label}</div>
                    <div class="resource-value">${value}</div>
                </div>
            `;
        }

        function renderPlayerState(player) {
            return `
                ${resourceItem("生命", player.hp)}
                ${resourceItem("气", player.qi)}
                ${resourceItem("盾", player.shield)}
                ${resourceItem("火种", player.spark)}
                ${resourceItem("电池", player.battery)}
                ${resourceItem("镐", player.pickaxe)}
                ${resourceItem("闪次数", player.flash_used)}
            `;
        }

        function moveLabel(moveName, catalog) {
            const item = catalog.find(x => x.name === moveName);
            return item ? item.label : moveName;
        }

        function renderMoveGroups(containerId, legalMoves, catalog, seat) {
            const container = document.getElementById(containerId);
            container.innerHTML = "";

            for (const [groupKey, moveNames] of Object.entries(moveGroups)) {
                const title = document.createElement("div");
                title.className = "move-group-title";
                title.textContent = moveCategoryTitle(groupKey);
                container.appendChild(title);

                const grid = document.createElement("div");
                grid.className = "move-grid";

                for (const moveName of moveNames) {
                    const btn = document.createElement("button");
                    btn.className = "move-btn";
                    btn.type = "button";

                    const legal = legalMoves.includes(moveName);
                    if (!legal) {
                        btn.classList.add("disabled");
                    }

                    btn.innerHTML = `
                        <div class="move-label">${moveLabel(moveName, catalog)}</div>
                        <div class="move-name">${moveName}</div>
                    `;

                    btn.addEventListener("click", () => {
                        if (!legal) return;

                        container.querySelectorAll(".move-btn").forEach((node) => {
                            node.classList.remove("selected-p1", "selected-p2");
                        });

                        if (seat === "p1") {
                            btn.classList.add("selected-p1");
                        } else if (seat === "p2") {
                            btn.classList.add("selected-p2");
                        }

                        submitMove(seat, moveName);
                    });

                    grid.appendChild(btn);
                }

                container.appendChild(grid);
            }
        }

        function renderHistory(logs) {
            const historyEl = document.getElementById("history");
            historyEl.innerHTML = "";

            if (!logs || logs.length === 0) {
                historyEl.innerHTML = "<div class='muted'>当前还没有历史记录。</div>";
                return;
            }

            for (const log of logs.slice().reverse()) {
                const item = document.createElement("div");
                item.className = "history-item";
                item.innerHTML = `
                    <div><strong>第 ${log.round_num} 回合</strong></div>
                    <div>P1：${log.p1_move_label} (${log.p1_move})</div>
                    <div>P2：${log.p2_move_label} (${log.p2_move})</div>
                    <div>P1 伤害：${log.p1_damage_taken} | P2 伤害：${log.p2_damage_taken}</div>
                    <div><strong>总结：</strong>${log.summary}</div>
                `;
                historyEl.appendChild(item);
            }
        }

        function setRoomMessage(text, type = "info") {
            const el = document.getElementById("room-message");
            el.textContent = text;
            el.className = `message ${type}`;
        }

        function renderRoom(room) {
            latestRoom = room;

            document.getElementById("room-id").textContent = room.room_id;
            applyRoomStatusBadge(room.status);
            document.getElementById("p1-name").textContent = room.p1_name || "暂无";
            document.getElementById("p2-name").textContent = room.p2_name || "暂无";

            applySeatVisibility();
            applySeatHighlights();

            document.getElementById("pending-p1").textContent = room.pending_p1_move || "暂无";
            document.getElementById("pending-p2").textContent = room.pending_p2_move || "暂无";
            applyPendingHighlights(room);

            document.getElementById("p1-state").innerHTML = renderPlayerState(room.game.p1);
            document.getElementById("p2-state").innerHTML = renderPlayerState(room.game.p2);

            renderMoveGroups(
                "p1-move-groups",
                mySeat === "p1" ? (room.game.legal_moves?.p1 || []) : [],
                room.game.move_catalog || [],
                "p1"
            );

            renderMoveGroups(
                "p2-move-groups",
                mySeat === "p2" ? (room.game.legal_moves?.p2 || []) : [],
                room.game.move_catalog || [],
                "p2"
            );

            renderHistory(room.game.history || []);
        }

        async function fetchRoomState() {
            try {
                const res = await fetch(
                    `/api/rooms/${roomId}?player_token=${encodeURIComponent(myPlayerToken)}`
                );
                const data = await res.json();

                if (!res.ok || !data.ok) {
                    setRoomMessage(data.error || "房间状态获取失败。", "error");
                    return;
                }

                if (data.room.requester_seat) {
                    mySeat = data.room.requester_seat;
                }

                renderRoom(data.room);
            } catch (error) {
                setRoomMessage("房间状态获取失败：" + error, "error");
            }
        }

        async function submitMove(seat, moveName) {
            try {
                const res = await fetch(`/api/rooms/${roomId}/step`, {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        player_token: myPlayerToken,
                        move_name: moveName
                    })
                });

                const data = await res.json();

                if (!res.ok || !data.ok) {
                    setRoomMessage(data.error || "提交动作失败。", "error");
                    return;
                }

                renderRoom(data.room);

                if (data.resolved) {
                    setRoomMessage(data.message || "本回合已结算。", "success");
                } else {
                    setRoomMessage(data.message || "已提交动作，等待另一方。", "waiting");
                }

                const msgEl = document.getElementById(`${seat}-submit-msg`);
                msgEl.textContent = `${seat.toUpperCase()} 已提交 ${moveName}`;
            } catch (error) {
                setRoomMessage("提交动作失败：" + error, "error");
            }
        }

        async function resetRoomGame() {
            try {
                const res = await fetch(`/api/rooms/${roomId}/reset`, {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        player_token: myPlayerToken
                    })
                });

                const data = await res.json();

                if (!res.ok || !data.ok) {
                    setRoomMessage(data.error || "重置失败。", "error");
                    return;
                }

                renderRoom(data.room);
                setRoomMessage(data.message || "房间对局已重置。", "success");

                document.getElementById("p1-submit-msg").textContent = "";
                document.getElementById("p2-submit-msg").textContent = "";
            } catch (error) {
                setRoomMessage("重置失败：" + error, "error");
            }
        }

        document.getElementById("reset-room-btn").addEventListener("click", resetRoomGame);

        applySeatVisibility();
        applySeatHighlights();
        setRoomMessage("正在连接房间并同步状态……", "info");
