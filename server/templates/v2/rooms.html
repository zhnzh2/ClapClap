<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ClapClap 2.0 · 多人房间</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/v2_rooms.css') }}" />
    <link rel="stylesheet" href="{{ url_for('static', filename='css/auth.css') }}" />
</head>
<body>
<div class="container">

    <!-- ── 顶部栏 ── -->
    <div class="top-bar">
        <div>
            <h1>ClapClap 2.0</h1>
            <div class="subtitle">多人在线对战 · 最多 6 人 · 速度层结算</div>
        </div>
        <div class="top-actions">
            <button class="btn-ghost" id="header-account-btn">账号</button>
            <a class="btn-ghost" href="/v2">< 返回大厅</a>
        </div>
    </div>

    {% if error_message %}
    <div class="error-box">{{ error_message }}</div>
    {% endif %}

    <!-- ── 两个入口卡片 ── -->
    <div class="entry-cards">
        <div class="entry-card" id="create-entry-card">
            <div class="entry-icon">➕</div>
            <div class="entry-title">创建房间</div>
            <div class="entry-desc">选择规则与人数，生成房间号邀请好友</div>
        </div>
        <div class="entry-card" id="join-entry-card">
            <div class="entry-icon">🔗</div>
            <div class="entry-title">加入房间</div>
            <div class="entry-desc">输入房间号或从公开列表中选择</div>
        </div>
    </div>

    <!-- ═══════════════════════════════════════════════════════ -->
    <!-- 创建房间面板（初始隐藏） -->
    <!-- ═══════════════════════════════════════════════════════ -->
    <div id="create-panel" class="panel" style="display:none;">
        <h2>创建新房间</h2>
        <div class="form-row">
            <div class="form-group">
                <label>最大人数</label>
                <div class="stepper">
                    <button id="create-max-dec">−</button>
                    <span id="create-max">4</span>
                    <button id="create-max-inc">+</button>
                </div>
            </div>
            <div class="form-group">
                <label>最少开始人数</label>
                <div class="stepper">
                    <button id="create-min-dec">−</button>
                    <span id="create-min">2</span>
                    <button id="create-min-inc">+</button>
                </div>
            </div>
        </div>
        <div class="form-row">
            <div class="form-group">
                <label>开始条件</label>
                <select id="create-start-condition">
                    <option value="host">房主手动开始</option>
                    <option value="all_ready">全员准备</option>
                    <option value="full">满员自动</option>
                </select>
            </div>
            <div class="form-group">
                <label>&nbsp;</label>
                <label class="checkbox-label">
                    <input type="checkbox" id="create-allow-spectate" checked />
                    允许观战
                </label>
            </div>
            <div class="form-group">
                <label>房间密码（可选）</label>
                <input type="text" id="create-password" placeholder="留空则无密码" maxlength="20" style="width:100%;padding:6px 10px;border:1px solid var(--border);border-radius:6px;" />
            </div>
        </div>
        <div class="form-row">
            <div class="form-group">
                <label class="checkbox-label">
                    <input type="checkbox" id="create-public" />
                    公开房间（显示在加入列表中）
                </label>
            </div>
        </div>
        <div class="panel-actions">
            <button class="btn-primary" id="create-room-btn">创建房间</button>
            <button class="btn-secondary" id="create-cancel-btn">取消</button>
        </div>
        <div id="create-message" class="message"></div>
    </div>

    <!-- ═══════════════════════════════════════════════════════ -->
    <!-- 加入房间面板（初始隐藏） -->
    <!-- ═══════════════════════════════════════════════════════ -->
    <div id="join-panel" class="panel" style="display:none;">
        <h2>加入房间</h2>

        <!-- 输入房间号 -->
        <div class="join-code-row">
            <input id="join-room-id" type="text" placeholder="输入房间号（如 ABC123）" maxlength="6" autocomplete="off" />
            <button class="btn-primary" id="join-room-btn">加入</button>
        </div>
        <div id="join-message" class="message"></div>

        <!-- 公开房间列表 -->
        <div class="section-divider"><span>公开房间</span></div>
        <!-- 筛选栏 -->
        <div class="filter-bar">
            <select id="filter-status" class="filter-select">
                <option value="">全部状态</option>
                <option value="lobby">等待中</option>
                <option value="playing">游戏中</option>
            </select>
            <select id="filter-min-slots" class="filter-select">
                <option value="">全部空位</option>
                <option value="1">至少 1 个空位</option>
                <option value="2">至少 2 个空位</option>
                <option value="3">至少 3 个空位</option>
            </select>
        </div>
        <div class="room-table-wrap">
            <table class="room-table" id="public-rooms-table">
                <thead>
                    <tr>
                        <th>房间号</th>
                        <th>房主</th>
                        <th>人数</th>
                        <th>观战</th>
                        <th>状态</th>
                        <th>操作</th>
                    </tr>
                </thead>
                <tbody id="public-rooms-body">
                    <tr><td colspan="5" class="table-empty">加载中...</td></tr>
                </tbody>
            </table>
        </div>
        <div id="join-panel-message" class="message"></div>
    </div>

</div>

<script src="{{ url_for('static', filename='js/core/storage.js') }}"></script>
<script src="{{ url_for('static', filename='js/core/session.js') }}"></script>
<script src="{{ url_for('static', filename='js/core/message.js') }}"></script>
<script src="{{ url_for('static', filename='js/core/api.js') }}"></script>
<script src="{{ url_for('static', filename='js/core/modal.js') }}"></script>
<script src="{{ url_for('static', filename='js/online/v2_room_identity.js') }}"></script>
<script src="{{ url_for('static', filename='js/pages/account_modal.js') }}"></script>
<script src="{{ url_for('static', filename='js/pages/admin_users_modal.js') }}"></script>
<script>
if (!window.SessionUtils || !window.SessionUtils.isLoggedIn()) {
    window.location.href = "/login";
}
var btn = document.getElementById("header-account-btn");
if (btn) {
    var user = window.SessionUtils.getSessionUser();
    if (user) {
        btn.textContent = user.username;
        btn.addEventListener("click", function () { window.location.href = "/user/" + user.uid; });
    }
}
</script>
<script src="{{ url_for('static', filename='js/pages/v2_rooms_page.js') }}"></script>
<!-- 密码弹窗 -->
<div class="modal-mask" id="password-modal-mask" style="z-index:1050;">
    <div class="modal-card" style="max-width:360px;">
        <div class="modal-title">此房间需要密码</div>
        <div class="modal-body">
            <input type="password" id="password-input" placeholder="请输入房间密码" maxlength="20" style="width:100%;padding:8px 12px;border:1px solid var(--border);border-radius:6px;font-size:15px;" />
        </div>
        <div class="modal-actions">
            <button class="action-btn primary" id="password-submit-btn">确认</button>
            <button class="action-btn secondary" id="password-cancel-btn">取消</button>
        </div>
    </div>
</div>

<div class="modal-mask" id="global-modal-mask" style="z-index: 1100;">
    <div class="modal-card" id="global-modal-card">
        <div class="modal-icon" id="global-modal-icon" style="display:none;"></div>
        <div class="modal-title" id="global-modal-title"></div>
        <div class="modal-body" id="global-modal-body"></div>
        <div class="modal-actions" id="global-modal-actions"></div>
    </div>
</div>
<script>if (typeof ModalUtils!=="undefined" && ModalUtils.bindGlobalModalEvents) ModalUtils.bindGlobalModalEvents();</script>
</body>
</html>
