<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ClapClap {{ version }} 规则书</title>
    <style>
        :root {
            --bg: #f4f6fb;
            --card: #ffffff;
            --text: #1f2937;
            --muted: #6b7280;
            --border: #e5e7eb;
            --blue: #2563eb;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0; padding: 0;
            font-family: "Noto Serif CJK SC", "Source Han Serif SC", "SimSun", "Songti SC", Georgia, serif;
            background: var(--bg); color: var(--text);
            line-height: 1.85; font-size: 15px;
        }
        .container { max-width: 780px; margin: 0 auto; padding: 18px 18px 60px; }

        .top-bar {
            display: flex; justify-content: space-between; align-items: center;
            gap: 10px; margin-bottom: 20px; flex-wrap: wrap;
        }
        .top-bar h1 { margin: 0; font-size: 24px; }
        .top-actions { display: flex; gap: 8px; }

        .action-btn {
            border: none; border-radius: 10px; padding: 8px 14px;
            cursor: pointer; font-size: 13px; font-weight: bold;
            background: #e5e7eb; color: #111827;
            text-decoration: none; display: inline-block;
            font-family: Arial, "Microsoft YaHei", sans-serif;
        }
        .action-btn.primary { background: #2563eb; color: white; }
        .action-btn.secondary { background: #6b7280; color: white; }

        .rule-body {
            background: var(--card); border-radius: 14px;
            padding: 28px 32px; box-shadow: 0 3px 12px rgba(0,0,0,0.06);
        }
        .rule-body h2 {
            font-size: 20px; margin: 32px 0 12px; padding-bottom: 6px;
            border-bottom: 1px solid var(--border); color: #111827;
        }
        .rule-body h2:first-child { margin-top: 0; }
        .rule-body h3 {
            font-size: 16px; margin: 20px 0 8px; color: #374151;
        }
        .rule-body p { margin: 0 0 12px; }
        .rule-body ul { margin: 0 0 16px; padding-left: 20px; }
        .rule-body li { margin-bottom: 4px; }
        .rule-body code {
            background: #f1f5f9; padding: 1px 6px; border-radius: 4px;
            font-size: 13px; font-family: "JetBrains Mono", "Consolas", monospace;
        }
        .rule-body table {
            width: 100%; border-collapse: collapse; margin: 12px 0 20px;
            font-size: 13px;
        }
        .rule-body th {
            background: #f8fafc; padding: 8px 10px;
            border: 1px solid #e2e8f0; text-align: left; font-weight: bold;
        }
        .rule-body td {
            padding: 7px 10px; border: 1px solid #e2e8f0;
        }
        .rule-body hr { border: none; border-top: 1px solid var(--border); margin: 24px 0; }

        .toc { margin: 0 0 24px; padding: 0; list-style: none; }
        .toc li { margin-bottom: 2px; }
        .toc a { color: var(--blue); text-decoration: none; font-size: 14px; }
        .toc a:hover { text-decoration: underline; }

        @media (max-width: 640px) {
            .rule-body { padding: 18px 16px; }
            .rule-body table { font-size: 11px; }
        }
    </style>
</head>
<body>
<div class="container">
    <div class="top-bar">
        <h1>ClapClap {{ version }} 规则书</h1>
        <div class="top-actions">
            {% if version == "1.0" %}
            <a class="action-btn secondary" href="/v2/rules">查看 2.0 规则</a>
            {% else %}
            <a class="action-btn secondary" href="/v1/rules">查看 1.0 规则</a>
            {% endif %}
            <a class="action-btn" href="javascript:history.back()">返回</a>
        </div>
    </div>

    <div class="rule-body">
        {% if version == "1.0" %}
        {% include "rule_1.0_content.html" %}
        {% else %}
        {% include "rule_2.0_content.html" %}
        {% endif %}
    </div>
</div>
</body>
</html>
