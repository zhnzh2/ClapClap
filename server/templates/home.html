<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ClapClap 模式大厅</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/auth.css') }}" />
    <style>
        :root {
            --bg: #f4f6fb;
            --card: #ffffff;
            --text: #1f2937;
            --muted: #6b7280;
            --shadow: 0 4px 14px rgba(0, 0, 0, 0.08);
            --blue: #2563eb;
            --border: #e5e7eb;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, "Microsoft YaHei", sans-serif;
            background: var(--bg);
            color: var(--text);
        }

        .container {
            max-width: 1120px;
            margin: 0 auto;
            padding: 28px 18px 40px;
        }

        .hero {
            text-align: center;
            margin-bottom: 28px;
            position: relative;
        }

        .hero h1 {
            margin: 0 0 10px 0;
            font-size: 38px;
        }

        .hero p {
            margin: 0;
            color: var(--muted);
            font-size: 16px;
        }

        .header-actions {
            position: fixed;
            top: 18px;
            right: 18px;
            z-index: 100;
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 6px;
            border: 1px solid rgba(229, 231, 235, 0.92);
            border-radius: 18px;
            background: rgba(255, 255, 255, 0.82);
            box-shadow: 0 12px 30px rgba(15, 23, 42, 0.10);
            backdrop-filter: blur(14px);
        }

        .header-actions .header-account-btn {
            position: static;
            top: auto;
            right: auto;
            min-height: 40px;
            padding: 0 16px;
            border-radius: 12px;
            box-shadow: none;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            white-space: nowrap;
        }

        .header-actions .header-account-btn:hover {
            background: #eff6ff;
        }

        .header-actions .header-account-btn.danger {
            background: #ef4444;
            color: #ffffff;
            border-color: #ef4444;
        }

        .header-actions .header-account-btn.danger:hover {
            background: #dc2626;
        }

        .version-switch-btn {
            position: absolute;
            left: 0;
            top: 8px;
            display: inline-block;
            text-decoration: none;
            padding: 4px 12px;
            border-radius: 8px;
            background: #fef3c7;
            color: #92400e;
            border: 1px solid #f59e0b;
            font-size: 13px;
            font-weight: bold;
            transition: background 0.15s;
        }

        .version-switch-btn:hover { background: #fde68a; }

        .mode-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 18px;
        }

        .mode-card {
            background: var(--card);
            border-radius: 18px;
            padding: 22px;
            box-shadow: var(--shadow);
            border: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .mode-card h2 {
            margin: 0;
            font-size: 24px;
        }

        .mode-card p {
            margin: 0;
            line-height: 1.8;
            color: #374151;
        }

        .badge {
            display: inline-block;
            width: fit-content;
            padding: 5px 10px;
            border-radius: 999px;
            background: #eff6ff;
            color: #1d4ed8;
            font-size: 13px;
            font-weight: bold;
        }

        .muted-badge {
            background: #f3f4f6;
            color: #4b5563;
        }

        .actions {
            margin-top: auto;
        }

        .btn {
            display: inline-block;
            text-decoration: none;
            border: none;
            border-radius: 12px;
            padding: 11px 16px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            background: var(--blue);
            color: white;
        }

        .btn.secondary {
            background: #6b7280;
        }

        .footer-note {
            margin-top: 26px;
            text-align: center;
            color: var(--muted);
            font-size: 14px;
        }

        @media (max-width: 820px) {
            .header-actions {
                position: static;
                width: fit-content;
                max-width: 100%;
                margin: 0 0 18px auto;
                flex-wrap: wrap;
                justify-content: flex-end;
            }

            .mode-grid {
                grid-template-columns: 1fr;
            }

            .hero h1 {
                font-size: 30px;
            }
        }

        @media (max-width: 560px) {
            .header-actions {
                width: 100%;
                justify-content: stretch;
                gap: 8px;
            }

            .header-actions .header-account-btn {
                flex: 1 1 calc(50% - 4px);
                min-width: 0;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header-actions">
            <a class="header-account-btn" href="/rules/1.0">规则界面</a>
            <button class="header-account-btn" id="header-admin-btn" style="display:none;">查看用户</button>
            <button class="header-account-btn" id="header-account-btn">账号</button>
            <button class="header-account-btn danger" id="header-logout-btn">退出登录</button>
        </div>

        <div class="hero">
            <a class="version-switch-btn" href="/v2" title="切换到 2.0 多人版">2.0</a>
            <h1>ClapClap</h1>
            <p>选择一种模式开始游戏</p>
        </div>

        <div class="mode-grid">
            <div class="mode-card">
                <span class="badge">当前可用</span>
                <h2>模拟对战</h2>
                <p>本地双人操作模式，是当前最稳定的正式入口。适合体验规则、测试玩法、检查回合结算。</p>
                <div class="actions">
                    <a class="btn" href="/local">进入模式</a>
                </div>
            </div>

            <div class="mode-card">
                <span class="badge" id="rooms-mode-badge">当前可用</span>
                <h2>房间模式</h2>
                <p id="rooms-mode-desc">创建或加入房间，与指定玩家进行联机对战。</p>
                <div class="actions">
                    <a class="btn" href="/rooms">进入模式</a>
                </div>
            </div>

            <div class="mode-card" id="match-mode-card">
                <span class="badge" id="match-mode-badge">当前可用</span>
                <h2 id="match-mode-title">匹配模式</h2>
                <p id="match-mode-desc">进入匹配队列，与在线玩家自动配对。</p>
                <div class="actions">
                    <a class="btn" id="match-mode-btn" href="/match">进入模式</a>
                </div>
            </div>

            <div class="mode-card">
                <span class="badge muted-badge" id="ai-mode-badge">后续接入</span>
                <h2>和电脑 AI 对战</h2>
                <p id="ai-mode-desc">等 AI 训练好后，就可以在这里和电脑进行正式对战。</p>
                <div class="actions">
                    <a class="btn secondary" href="/ai">查看页面</a>
                </div>
            </div>
        </div>

            <div class="footer-note">
                当前开发进度：大厅、本地、房间、匹配页面与主要联机链路已接通；下一阶段将继续做代码整理、测试补强与 AI 模式接入。
            </div>

        <!-- 全局弹窗遮罩 -->
        <div class="modal-mask" id="global-modal-mask" style="z-index: 1100;">
            <div class="modal-card" id="global-modal-card">
                <div class="modal-icon" id="global-modal-icon" style="display: none;"></div>
                <div class="modal-title" id="global-modal-title"></div>
                <div class="modal-body" id="global-modal-body"></div>
                <div class="modal-actions" id="global-modal-actions"></div>
            </div>
        </div>
    </div>

    <script>
        window.SERVER_BOOT_ID = "{{ server_boot_id }}";
    </script>
    <script src="{{ url_for('static', filename='js/core/storage.js') }}"></script>
    <script src="{{ url_for('static', filename='js/core/session.js') }}"></script>
    <script src="{{ url_for('static', filename='js/core/api.js') }}"></script>
    <script src="{{ url_for('static', filename='js/core/logout_button.js') }}"></script>
    <script src="{{ url_for('static', filename='js/core/boot.js') }}"></script>
    <script src="{{ url_for('static', filename='js/core/modal.js') }}"></script>
    <script src="{{ url_for('static', filename='js/online/room_identity.js') }}"></script>
    <script src="{{ url_for('static', filename='js/online/resume_room.js') }}"></script>
    <script src="{{ url_for('static', filename='js/pages/account_modal.js') }}"></script>
    <script src="{{ url_for('static', filename='js/pages/admin_users_modal.js') }}"></script>
    <script src="{{ url_for('static', filename='js/pages/home_page.js') }}"></script>
    <script>if (typeof ModalUtils !== "undefined" && ModalUtils.bindGlobalModalEvents) { ModalUtils.bindGlobalModalEvents(); }</script>
    <script>if (typeof window.initHomePage === "function") { window.initHomePage(); }</script>

</body>
</html>
