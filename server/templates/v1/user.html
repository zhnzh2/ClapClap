<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>用户主页 - ClapClap</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/auth.css') }}" />
    <link rel="stylesheet" href="{{ url_for('static', filename='css/v1/v1_user.css') }}" />
    <style>
        :root {
            --bg: #f4f6fb;
            --card: #ffffff;
            --text: #1f2937;
            --muted: #6b7280;
            --shadow: 0 4px 14px rgba(0, 0, 0, 0.08);
            --blue: #2563eb;
            --border: #e5e7eb;
            --input-focus: #f0f3ff;
            --sidebar-bg: #f8f9fc;
            --sidebar-active: #eef2ff;
            --accent: #446aa5;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, "Microsoft YaHei", sans-serif;
            background: var(--bg);
            color: var(--text);
        }
    </style>
</head>
<body>
    <div class="page-top-shell">
        <a class="site-logo-link" href="/v1" title="返回 1.0 主页">
            <img class="site-logo-img" src="{{ url_for('static', filename='Clapclap_logo.png') }}" alt="ClapClap" />
        </a>
        <div class="header-actions">
            <a class="header-account-btn" href="/v1/rules">规则界面</a>
            <button class="header-account-btn" id="header-admin-btn" style="display:none;">查看用户</button>
            <button class="header-account-btn" id="header-account-btn">账号</button>
            <button class="header-account-btn danger" id="header-logout-btn">退出登录</button>
        </div>
        <div class="page-title-block">
            <h1>用户主页</h1>
            <p>查看资料、偏好设置和历史对局</p>
        </div>
    </div>

    <!-- 加载中 -->
    <div class="user-page-loading" id="user-page-loading">
        <div class="user-loading-text">加载中...</div>
    </div>

    <!-- 用户页面主体 -->
    <div class="user-page" id="user-page" style="display:none;">
        <!-- 左侧边栏 -->
        <aside class="user-sidebar">
            <div class="user-sidebar-header">
                <button class="user-back-btn" id="user-back-btn">← 返回</button>
            </div>
            <div class="user-sidebar-avatar">
                <div class="user-avatar-circle" id="user-avatar-circle"></div>
                <div class="user-sidebar-name" id="user-sidebar-name"></div>
                <div class="user-sidebar-role" id="user-sidebar-role"></div>
            </div>
            <nav class="user-sidebar-nav">
                <button class="user-nav-item user-nav-item-active" data-panel="info">基本信息</button>
                <button class="user-nav-item" data-panel="settings">设置</button>
                <button class="user-nav-item" data-panel="battles">历史对局</button>
            </nav>
        </aside>

        <!-- 右侧内容区 -->
        <main class="user-content" id="user-content">
            <!-- 由 JS 动态填充 -->
        </main>
    </div>

    <!-- 错误页 -->
    <div class="user-page-error" id="user-page-error" style="display:none;">
        <div class="user-error-text" id="user-error-text"></div>
    </div>

    <!-- JS -->
    <script src="{{ url_for('static', filename='js/core/session.js') }}"></script>
    <script src="{{ url_for('static', filename='js/core/api.js') }}"></script>
    <script src="{{ url_for('static', filename='js/core/logout_button.js') }}"></script>
    <script src="{{ url_for('static', filename='js/core/modal.js') }}"></script>
    <script src="{{ url_for('static', filename='js/pages/admin_users_modal.js') }}"></script>
    <script>
        // 传递 UID 给 JS
        window.USER_PAGE_UID = {{ uid }};
    </script>
    <script src="{{ url_for('static', filename='js/pages/v1/v1_user_page.js') }}"></script>
</body>
</html>
