<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ClapClap 1.0 AI 对战</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/v1/v1_local.css') }}" />
    <link rel="stylesheet" href="{{ url_for('static', filename='css/auth.css') }}" />
    <style>
        body.ai-page-body {
            height: 100vh;
            overflow: hidden;
        }
        .ai-shell {
            max-width: 1180px;
            height: calc(100vh - 20px);
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .ai-entry-page,
        .ai-battle-page {
            min-height: 0;
            flex: 1;
        }
        .ai-entry-page {
            display: grid;
            place-items: center;
        }
        .ai-entry-card {
            width: min(760px, 100%);
            background: var(--card);
            border-radius: 12px;
            box-shadow: var(--shadow);
            padding: 18px;
        }
        .ai-entry-top {
            display: flex;
            justify-content: space-between;
            gap: 12px;
            align-items: flex-start;
            margin-bottom: 16px;
        }
        .ai-entry-title h1 {
            margin: 0;
            font-size: 26px;
            line-height: 1.15;
        }
        .ai-entry-title p {
            margin: 6px 0 0 0;
            color: var(--muted);
            font-size: 13px;
        }
        .ai-entry-actions,
        .ai-battle-actions {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            justify-content: flex-end;
        }
        .ai-option-block {
            margin-top: 12px;
        }
        .ai-option-title {
            font-weight: 800;
            font-size: 13px;
            color: #374151;
            margin-bottom: 8px;
        }
        .ai-option-row {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 8px;
        }
        .ai-choice-btn,
        .ai-diff-btn,
        .ai-seat-btn {
            border: 1px solid var(--border);
            border-radius: 8px;
            background: #fff;
            color: var(--text);
            cursor: pointer;
            font-weight: 800;
            transition: 0.15s ease;
        }
        .ai-choice-btn {
            min-height: 72px;
            padding: 10px;
            text-align: left;
        }
        .ai-choice-btn strong {
            display: block;
            font-size: 15px;
            margin-bottom: 4px;
        }
        .ai-choice-btn span {
            color: var(--muted);
            font-size: 12px;
            line-height: 1.4;
        }
        .ai-choice-btn.active,
        .ai-diff-btn.active,
        .ai-seat-btn.active {
            border-color: #2563eb;
            background: #eff6ff;
            color: #1d4ed8;
            box-shadow: 0 0 0 2px rgba(37, 99, 235, 0.10);
        }
        .ai-start-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            margin-top: 16px;
            flex-wrap: wrap;
        }
        .ai-deploy-panel {
            display: none;
            margin-top: 14px;
            border: 1px solid #dbeafe;
            border-radius: 10px;
            padding: 10px;
            background: #f8fbff;
        }
        .ai-progress-track {
            height: 9px;
            border-radius: 999px;
            background: #e5e7eb;
            overflow: hidden;
            margin-top: 8px;
        }
        .ai-progress-fill {
            width: 0;
            height: 100%;
            border-radius: 999px;
            background: #2563eb;
            transition: width 0.12s ease;
        }
        .ai-battle-page {
            display: none;
            flex-direction: column;
            gap: 8px;
        }
        .ai-battle-page.show {
            display: flex;
        }
        .ai-battle-top {
            display: grid;
            grid-template-columns: minmax(0, 1fr) auto;
            gap: 8px;
            align-items: center;
            background: #fff;
            border-radius: 10px;
            padding: 8px 10px;
            box-shadow: var(--shadow);
        }
        .ai-battle-title {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
            min-width: 0;
        }
        .ai-battle-title h1 {
            margin: 0;
            font-size: 18px;
            line-height: 1.2;
        }
        .ai-main-grid {
            min-height: 0;
            flex: 1;
            display: grid;
            grid-template-columns: minmax(170px, 0.82fr) minmax(300px, 1.35fr) minmax(200px, 0.86fr);
            gap: 8px;
        }
        .ai-panel {
            min-height: 0;
            background: #fff;
            border-radius: 10px;
            box-shadow: var(--shadow);
            padding: 8px;
            overflow: hidden;
        }
        .ai-panel h2 {
            margin: 0 0 6px 0;
            font-size: 14px;
            line-height: 1.2;
        }
        .ai-resource-stack {
            display: grid;
            gap: 8px;
        }
        .ai-resource-card {
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 7px;
            background: #f9fafb;
        }
        .ai-resource-card.human {
            background: #eff6ff;
            border-color: #bfdbfe;
        }
        .ai-resource-card.ai {
            background: #fff1f2;
            border-color: #fecdd3;
        }
        .ai-resource-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 5px;
        }
        .ai-resource-grid .resource-item {
            min-height: 42px;
            padding: 5px 7px;
            border-radius: 7px;
        }
        .ai-resource-grid .resource-label {
            font-size: 10px;
            margin-bottom: 2px;
        }
        .ai-resource-grid .resource-value {
            font-size: 16px;
        }
        .ai-move-toolbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            margin-bottom: 4px;
        }
        .ai-move-toolbar h2 {
            margin: 0;
        }
        .ai-move-panel {
            display: flex;
            flex-direction: column;
        }
        .ai-move-groups {
            min-height: 0;
            flex: 1;
            overflow: hidden;
        }
        .ai-move-groups .move-group-title {
            margin: 5px 0 3px 0;
            font-size: 11px;
        }
        .ai-move-groups .move-grid {
            grid-template-columns: repeat(4, minmax(0, 1fr));
            gap: 5px;
        }
        .ai-move-groups .move-btn {
            min-height: 45px;
            padding: 5px 4px;
            border-radius: 8px;
        }
        .ai-move-groups .move-label {
            font-size: 13px;
            margin-bottom: 0;
        }
        .ai-move-groups .move-name,
        .ai-move-groups .move-hotkey {
            display: none;
        }
        .ai-battle-page.show-codes .move-name,
        .ai-battle-page.show-hotkeys .move-hotkey {
            display: block;
        }
        .ai-submit-row {
            display: grid;
            grid-template-columns: 1fr auto;
            gap: 8px;
            margin-top: 6px;
            align-items: center;
        }
        .ai-message-line {
            min-width: 0;
            color: #374151;
            font-size: 13px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .ai-side-panel {
            display: grid;
            grid-template-rows: auto auto minmax(0, 1fr);
            gap: 8px;
        }
        .ai-move-box,
        .ai-latest-box,
        .ai-history-box {
            border: 1px solid var(--border);
            border-radius: 8px;
            background: #f9fafb;
            padding: 8px;
            font-size: 12px;
            line-height: 1.45;
        }
        .ai-latest-box.compact .round-detail-extra {
            display: none;
        }
        .ai-history-box {
            min-height: 0;
            overflow: auto;
        }
        .ai-history-box.hidden,
        .ai-policy-extra.hidden {
            display: none;
        }
        .ai-history-box .history-item {
            padding: 6px;
            font-size: 12px;
            line-height: 1.45;
            border-radius: 7px;
        }
        .ai-settings-grid {
            display: grid;
            gap: 8px;
            margin: 8px 0 14px 0;
        }
        .ai-setting-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            border-bottom: 1px solid #f1f5f9;
            padding: 7px 0;
        }
        .ai-setting-row span {
            color: var(--muted);
            font-size: 12px;
        }
        .ai-hidden {
            display: none !important;
        }
        @media (max-width: 680px) {
            body.ai-page-body {
                overflow: auto;
            }
            .ai-shell {
                height: auto;
                min-height: calc(100vh - 20px);
            }
            .ai-main-grid,
            .ai-option-row {
                grid-template-columns: 1fr;
            }
            .ai-battle-top {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body class="ai-page-body">
<div class="ai-shell">
    <section class="ai-entry-page" id="ai-entry-page">
        <div class="ai-entry-card">
            <div class="ai-entry-top">
                <div class="ai-entry-title">
                    <h1>1.0 AI 对战</h1>
                    <p>选择座位和难度后进入对战。困难模式会先检查模型部署状态。</p>
                </div>
                <div class="ai-entry-actions">
                    <a class="action-btn secondary" href="/v1">返回大厅</a>
                    <button class="action-btn secondary" id="header-admin-btn" style="display:none;">查看用户</button>
                    <button class="action-btn secondary" id="header-account-btn">账号</button>
                    <button class="action-btn danger" id="header-logout-btn">退出登录</button>
                </div>
            </div>

            <div class="ai-option-block">
                <div class="ai-option-title">你的座位</div>
                <div class="ai-option-row">
                    <button class="ai-choice-btn ai-seat-btn" data-seat="p1">
                        <strong>P1 先手</strong>
                        <span>你先行动，AI 控制 P2。</span>
                    </button>
                    <button class="ai-choice-btn ai-seat-btn" data-seat="p2">
                        <strong>P2 后手</strong>
                        <span>AI 控制 P1，你控制 P2。</span>
                    </button>
                </div>
            </div>

            <div class="ai-option-block">
                <div class="ai-option-title">AI 难度</div>
                <div class="ai-option-row">
                    <button class="ai-choice-btn ai-diff-btn" data-diff="easy">
                        <strong>简单</strong>
                        <span>随机合法动作，适合熟悉规则。</span>
                    </button>
                    <button class="ai-choice-btn ai-diff-btn" data-diff="normal">
                        <strong>普通</strong>
                        <span>启发式策略，反应更稳定。</span>
                    </button>
                    <button class="ai-choice-btn ai-diff-btn" data-diff="hard">
                        <strong>困难</strong>
                        <span>进入前检查部署模型，不可用时自动降级。</span>
                    </button>
                </div>
            </div>

            <div class="ai-deploy-panel" id="ai-deploy-panel">
                <div id="ai-deploy-text">准备进入对战...</div>
                <div class="ai-progress-track">
                    <div class="ai-progress-fill" id="ai-deploy-progress"></div>
                </div>
            </div>

            <div class="ai-start-row">
                <div class="muted" id="ai-entry-message">默认：P1 先手，普通难度。</div>
                <button class="action-btn primary" id="ai-start-btn">开始对战</button>
            </div>
        </div>
    </section>

    <section class="ai-battle-page" id="ai-battle-page">
        <div class="ai-battle-top">
            <div class="ai-battle-title">
                <h1>AI 对战</h1>
                <div id="ai-basic-info" class="status-line"></div>
            </div>
            <div class="ai-battle-actions">
                <button class="action-btn secondary" id="ai-settings-btn">设置</button>
                <button class="action-btn secondary" id="ai-help-btn">帮助</button>
                <button class="action-btn secondary" id="ai-refresh-btn">刷新</button>
                <button class="action-btn danger" id="ai-reset-btn">退出本局</button>
            </div>
        </div>

        <div class="ai-main-grid">
            <div class="ai-panel">
                <div class="ai-resource-stack">
                    <div class="ai-resource-card human">
                        <h2 id="ai-human-state-title">你的资源 (P1)</h2>
                        <div id="ai-p1-state" class="ai-resource-grid"></div>
                    </div>
                    <div class="ai-resource-card ai">
                        <h2 id="ai-opponent-state-title">AI 资源 (P2)</h2>
                        <div id="ai-p2-state" class="ai-resource-grid"></div>
                    </div>
                </div>
            </div>

            <div class="ai-panel ai-move-panel">
                <div class="ai-move-toolbar">
                    <h2>你的动作</h2>
                    <button class="action-btn" id="ai-clear-btn">清空</button>
                </div>
                <div id="ai-p1-move-groups" class="ai-move-groups"></div>
                <div class="ai-submit-row">
                    <div id="ai-message" class="ai-message-line">选择动作后出招。</div>
                    <button class="action-btn primary" id="ai-step-btn">出招</button>
                </div>
            </div>

            <div class="ai-panel ai-side-panel">
                <div>
                    <h2>AI 出招</h2>
                    <div class="ai-move-box" id="ai-move-box">
                        <div class="muted">等待你出招...</div>
                    </div>
                </div>
                <div>
                    <h2>最近结果</h2>
                    <div id="ai-latest-round" class="ai-latest-box compact">当前还没有回合记录。</div>
                </div>
                <div id="ai-history-wrap" class="ai-history-box hidden">
                    <h2>历史记录</h2>
                    <div id="ai-history"></div>
                </div>
            </div>
        </div>
    </section>
</div>

<!-- 结束弹窗 -->
<div id="ai-end-modal-mask" class="modal-mask">
    <div class="modal" style="max-width:460px;">
        <div class="modal-close-row">
            <button class="action-btn" id="ai-end-close-btn">关闭</button>
        </div>
        <div class="end-modal-content">
            <div><strong>游戏结束</strong></div>
            <div class="big-result" id="ai-end-result-text">结果</div>
            <div id="ai-end-result-detail" class="muted"></div>
            <div class="muted" style="margin-top:6px;">按 Enter 可快速重新开始，按 Backspace 可关闭弹窗。</div>
            <div style="margin-top:14px;">
                <button class="action-btn primary" id="ai-end-reset-btn">重新开始一局</button>
            </div>
        </div>
    </div>
</div>

<!-- 设置弹窗 -->
<div id="ai-settings-modal-mask" class="modal-mask">
    <div class="modal" style="max-width:460px;">
        <div class="modal-close-row">
            <button class="action-btn" id="ai-settings-close-btn">关闭</button>
        </div>
        <h2>对战显示设置</h2>
        <div class="ai-settings-grid">
            <label class="ai-setting-row">
                <div>显示动作英文名<br><span>例如 QI、SHIELD、GI。</span></div>
                <input type="checkbox" class="ai-setting-toggle" data-setting="showMoveCodes" />
            </label>
            <label class="ai-setting-row">
                <div>显示快捷键<br><span>动作按钮右上角的键盘提示。</span></div>
                <input type="checkbox" class="ai-setting-toggle" data-setting="showHotkeys" />
            </label>
            <label class="ai-setting-row">
                <div>显示 AI 策略<br><span>随机、启发式、模型降级等调试信息。</span></div>
                <input type="checkbox" class="ai-setting-toggle" data-setting="showPolicy" />
            </label>
            <label class="ai-setting-row">
                <div>显示推理耗时<br><span>每回合 AI 选招耗时。</span></div>
                <input type="checkbox" class="ai-setting-toggle" data-setting="showInference" />
            </label>
            <label class="ai-setting-row">
                <div>显示详细结算<br><span>双方说明和本回合总结。</span></div>
                <input type="checkbox" class="ai-setting-toggle" data-setting="showRoundDetails" />
            </label>
            <label class="ai-setting-row">
                <div>显示历史记录<br><span>打开后右侧会显示所有回合。</span></div>
                <input type="checkbox" class="ai-setting-toggle" data-setting="showHistory" />
            </label>
        </div>
    </div>
</div>

<!-- 全局弹窗遮罩 -->
<div class="modal-mask" id="global-modal-mask" style="z-index:1100;">
    <div class="modal-card" id="global-modal-card">
        <div class="modal-icon" id="global-modal-icon" style="display:none;"></div>
        <div class="modal-title" id="global-modal-title"></div>
        <div class="modal-body" id="global-modal-body"></div>
        <div class="modal-actions" id="global-modal-actions"></div>
    </div>
</div>

<script src="{{ url_for('static', filename='js/core/session.js') }}"></script>
<script src="{{ url_for('static', filename='js/core/api.js') }}"></script>
<script src="{{ url_for('static', filename='js/core/logout_button.js') }}"></script>
<script src="{{ url_for('static', filename='js/core/modal.js') }}"></script>
<script src="{{ url_for('static', filename='js/pages/admin_users_modal.js') }}"></script>
<script src="{{ url_for('static', filename='js/pages/ai_page.js') }}"></script>
<script>
    // 账号按钮
    var btn = document.getElementById("header-account-btn");
    if (btn) {
        var user = window.SessionUtils.getSessionUser();
        if (user) {
            btn.textContent = user.username;
            btn.addEventListener("click", function () {
                window.location.href = "/v1/user/" + user.uid;
            });
        }
    }
    if (typeof ModalUtils !== "undefined" && ModalUtils.bindGlobalModalEvents) {
        ModalUtils.bindGlobalModalEvents();
    }
</script>
</body>
</html>
