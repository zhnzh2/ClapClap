<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ClapClap 1.0 AI 对战</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/v2/v2_local.css') }}" />
    <link rel="stylesheet" href="{{ url_for('static', filename='css/auth.css') }}" />
    <style>
        body.ai-page-body {
            min-height: 100vh;
            height: 100vh;
            overflow: hidden;
            background: var(--bg);
        }

        body.ai-page-body .ai-shell {
            max-width: 1180px;
            height: calc(100vh - 20px);
            display: flex;
            flex-direction: column;
        }

        body.ai-page-body .page-mode-toolbar-group {
            pointer-events: auto;
        }

        body.ai-page-body:not(.ai-in-battle) .ai-battle-only {
            display: none !important;
        }

        .ai-entry-page,
        .ai-battle-page {
            min-height: 0;
            flex: 1;
        }

        .ai-entry-page {
            display: grid;
            place-items: center;
            padding-bottom: 8px;
        }

        .ai-entry-card {
            width: min(820px, 100%);
            margin-bottom: 0;
        }

        .ai-entry-card h2 {
            font-size: 20px;
        }

        .ai-option-block {
            width: 100%;
        }

        .ai-option-title {
            margin: 2px 0 8px;
            font-size: 13px;
            font-weight: bold;
            color: #4b5563;
        }

        .ai-option-row {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 10px;
            width: 100%;
            margin-bottom: 12px;
        }

        .ai-option-row.seat-row {
            grid-template-columns: repeat(2, minmax(0, 1fr));
        }

        .ai-choice-btn {
            min-height: 76px;
            text-align: left;
            align-items: flex-start;
            border-width: 2px;
            cursor: pointer;
        }

        .ai-choice-btn strong {
            display: block;
            margin-bottom: 4px;
            font-size: 15px;
            color: var(--text);
        }

        .ai-choice-btn span {
            display: block;
            font-size: 12px;
            line-height: 1.45;
            color: var(--muted);
            font-weight: normal;
        }

        .ai-choice-btn.active {
            border-color: var(--blue);
            background: linear-gradient(180deg, #eff6ff 0%, #ffffff 100%);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.10);
        }

        .ai-model-scale {
            display: grid;
            grid-template-columns: repeat(8, minmax(0, 1fr));
            width: 100%;
            margin-bottom: 8px;
            overflow: hidden;
            border: 1px solid var(--border);
            border-radius: 10px;
            background: #f8fafc;
        }

        .ai-model-btn {
            min-height: 48px;
            border: 0;
            border-right: 1px solid var(--border);
            background: #ffffff;
            color: var(--text);
            font-size: 16px;
            font-weight: 800;
            cursor: pointer;
        }

        .ai-model-btn:last-child {
            border-right: 0;
        }

        .ai-model-btn.active {
            background: var(--blue);
            color: #ffffff;
        }

        .ai-model-btn:disabled {
            cursor: not-allowed;
            background: #f3f4f6;
            color: #9ca3af;
        }

        .ai-model-btn.active:disabled {
            background: var(--blue);
            color: #ffffff;
        }

        .ai-model-note {
            min-height: 18px;
            margin-bottom: 12px;
            color: var(--muted);
            font-size: 12px;
            line-height: 1.45;
        }

        .ai-deploy-panel {
            display: none;
            width: 100%;
            margin-top: 2px;
        }

        .ai-progress-track {
            height: 9px;
            margin-top: 8px;
            overflow: hidden;
            border-radius: 999px;
            background: #e5e7eb;
        }

        .ai-progress-fill {
            width: 0;
            height: 100%;
            border-radius: 999px;
            background: var(--blue);
            transition: width 0.12s ease;
        }

        .ai-entry-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            width: 100%;
            margin-top: 10px;
            flex-wrap: wrap;
        }

        .ai-battle-page {
            display: none;
            flex-direction: column;
            gap: 8px;
        }

        .ai-battle-page.show {
            display: flex;
        }

        .ai-battle-head {
            display: grid;
            grid-template-columns: auto minmax(0, 1fr);
            align-items: center;
            gap: 12px;
            margin-bottom: 0;
            padding: 8px 10px;
        }

        .ai-battle-head h2 {
            margin: 0;
            white-space: nowrap;
        }

        .ai-main-grid {
            min-height: 0;
            flex: 1;
            display: grid;
            grid-template-columns: minmax(174px, 0.8fr) minmax(340px, 1.45fr) minmax(220px, 0.9fr);
            gap: 8px;
        }

        .ai-main-grid > .card {
            min-height: 0;
            margin-bottom: 0;
            overflow: hidden;
        }

        .ai-resource-panel,
        .ai-move-panel,
        .ai-side-panel {
            display: flex;
            flex-direction: column;
        }

        .ai-resource-stack {
            min-height: 0;
            display: grid;
            grid-template-rows: 1fr 1fr;
            gap: 8px;
        }

        .ai-resource-card {
            min-height: 0;
        }

        .ai-resource-card h2 {
            font-size: 14px;
            margin-bottom: 6px;
        }

        .ai-resource-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 5px;
        }

        .ai-resource-grid .resource-item {
            min-height: 42px;
            padding: 5px 7px;
            border-radius: 8px;
        }

        .ai-resource-grid .resource-label {
            margin-bottom: 2px;
            font-size: 10px;
        }

        .ai-resource-grid .resource-value {
            font-size: 16px;
        }

        .ai-move-toolbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            margin-bottom: 4px;
        }

        .ai-move-toolbar h2 {
            margin: 0;
        }

        .ai-move-groups {
            min-height: 0;
            flex: 1;
            overflow: hidden;
        }

        .ai-move-groups .move-group-title {
            margin: 5px 0 3px;
            font-size: 11px;
        }

        .ai-move-groups .move-grid {
            grid-template-columns: repeat(4, minmax(0, 1fr));
            gap: 5px;
        }

        .ai-move-groups .move-btn {
            min-height: 45px;
            padding: 5px 4px;
            border-radius: 8px;
        }

        .ai-battle-page.show-hotkeys .ai-move-groups .move-btn {
            padding-top: 13px;
        }

        .ai-move-groups .move-label {
            margin-bottom: 0;
            font-size: 13px;
        }

        .ai-move-groups .move-name,
        .ai-move-groups .move-hotkey {
            display: none;
        }

        .ai-battle-page.show-codes .move-name,
        .ai-battle-page.show-hotkeys .move-hotkey {
            display: block;
        }

        .ai-battle-page.show-hotkeys .move-hotkey {
            top: 3px;
            right: 4px;
            min-width: 18px;
            height: 16px;
            padding: 0 4px;
            border-radius: 5px;
            border: 1px solid #c7d2fe;
            background: #eef2ff;
            color: #3730a3;
            font-size: 10px;
            line-height: 15px;
            text-align: center;
            opacity: 1;
        }

        .ai-submit-row {
            display: grid;
            grid-template-columns: minmax(0, 1fr) auto;
            align-items: center;
            gap: 8px;
            margin-top: 6px;
        }

        .ai-message-line {
            min-width: 0;
            min-height: 18px;
            color: #374151;
            font-size: 13px;
            overflow: hidden;
            white-space: nowrap;
            text-overflow: ellipsis;
        }

        .ai-side-panel {
            gap: 8px;
        }

        .ai-side-section {
            min-height: 0;
        }

        .ai-move-box,
        .ai-latest-box,
        .ai-history-box {
            border: 1px solid var(--border);
            border-radius: 10px;
            background: #f9fafb;
            padding: 8px;
            font-size: 12px;
            line-height: 1.45;
        }

        .ai-latest-box.compact .round-detail-extra {
            display: none;
        }

        .ai-history-box {
            min-height: 0;
            overflow: auto;
        }

        .ai-history-box.hidden,
        .ai-policy-extra.hidden {
            display: none;
        }

        .ai-history-box .history-item {
            padding: 6px;
            font-size: 12px;
            line-height: 1.45;
        }

        .ai-settings-grid {
            display: grid;
            gap: 4px;
            margin: 8px 0 10px;
        }

        .ai-setting-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            padding: 8px 0;
            border-bottom: 1px solid #f1f5f9;
        }

        .ai-setting-row span {
            color: var(--muted);
            font-size: 12px;
        }

        .ai-hidden {
            display: none !important;
        }

        @media (max-width: 860px) {
            body.ai-page-body {
                height: auto;
                overflow: auto;
            }

            body.ai-page-body .ai-shell {
                height: auto;
                min-height: calc(100vh - 20px);
            }

            .ai-main-grid,
            .ai-option-row,
            .ai-option-row.seat-row,
            .ai-battle-head {
                grid-template-columns: 1fr;
            }

            .ai-move-groups {
                overflow: visible;
            }
        }
    </style>
</head>
<body class="ai-page-body">
<div class="container ai-shell">
    <div class="page-top-shell">
        <a class="site-logo-link" href="/v1" title="返回 1.0 主页">
            <img class="site-logo-img" src="{{ url_for('static', filename='Clapclap_logo.png') }}" alt="ClapClap" />
        </a>
        <a class="page-version-chip" href="/v1/local" title="切换到 1.0 本地双人版">本地</a>
        <div class="header-actions">
            <a class="header-account-btn" href="/v1/rules">规则界面</a>
            <button class="header-account-btn" id="header-admin-btn" style="display:none;">查看用户</button>
            <button class="header-account-btn" id="header-account-btn">账号</button>
            <button class="header-account-btn danger" id="header-logout-btn">退出登录</button>
        </div>
        <div class="page-title-block">
            <h1>1.0 AI 对战</h1>
            <p>选择座位和难度后开局，困难模式进入前会检查模型部署状态。</p>
        </div>
    </div>

    <div class="page-mode-toolbar">
        <div class="page-mode-toolbar-label">模式操作</div>
        <div class="top-actions page-mode-toolbar-group">
            <button class="action-btn secondary" id="ai-help-btn">帮助</button>
            <button class="action-btn secondary ai-battle-only" id="ai-settings-btn">设置</button>
            <button class="action-btn ai-battle-only" id="ai-refresh-btn">刷新</button>
            <button class="action-btn danger ai-battle-only" id="ai-reset-btn">退出本局</button>
        </div>
    </div>

    <section class="ai-entry-page" id="ai-entry-page">
        <div class="card setup-card ai-entry-card">
            <h2>准备阶段</h2>
            <div class="setup-controls">
                <div class="ai-option-block">
                    <div class="ai-option-title">你的座位</div>
                    <div class="ai-option-row seat-row">
                        <button class="setup-player-card ai-choice-btn ai-seat-btn" data-seat="p1">
                            <strong>P1 先手</strong>
                            <span>你先行动，AI 控制 P2。</span>
                        </button>
                        <button class="setup-player-card ai-choice-btn ai-seat-btn" data-seat="p2">
                            <strong>P2 后手</strong>
                            <span>AI 控制 P1，你控制 P2。</span>
                        </button>
                    </div>
                </div>

                <div class="ai-option-block">
                    <div class="ai-option-title">AI 难度</div>
                    <div class="ai-option-row">
                        <button class="setup-player-card ai-choice-btn ai-diff-btn" data-diff="easy">
                            <strong>简单</strong>
                            <span>随机合法动作，适合熟悉规则。</span>
                        </button>
                        <button class="setup-player-card ai-choice-btn ai-diff-btn" data-diff="normal">
                            <strong>普通</strong>
                            <span>启发式策略，反应更稳定。</span>
                        </button>
                        <button class="setup-player-card ai-choice-btn ai-diff-btn" data-diff="hard">
                            <strong>困难</strong>
                            <span>进入前检查部署模型，不可用时自动降级。</span>
                        </button>
                    </div>
                </div>

                <div class="ai-option-block">
                    <div class="ai-option-title">AI 模型</div>
                    <div class="ai-model-scale" aria-label="AI 模型选择">
                        <button class="ai-model-btn" type="button" data-model-key="clapfish1" title="ClapFish1">1</button>
                        <button class="ai-model-btn" type="button" data-model-key="clapfish2" title="ClapFish2">2</button>
                        <button class="ai-model-btn" type="button" disabled title="暂未开放">3</button>
                        <button class="ai-model-btn" type="button" disabled title="暂未开放">4</button>
                        <button class="ai-model-btn" type="button" disabled title="暂未开放">5</button>
                        <button class="ai-model-btn" type="button" disabled title="暂未开放">6</button>
                        <button class="ai-model-btn" type="button" disabled title="暂未开放">7</button>
                        <button class="ai-model-btn" type="button" disabled title="暂未开放">8</button>
                    </div>
                    <div class="ai-model-note" id="ai-model-note">当前模型：ClapFish2</div>
                </div>

                <div class="selection-box ai-deploy-panel" id="ai-deploy-panel">
                    <div id="ai-deploy-text">准备进入对战...</div>
                    <div class="ai-progress-track">
                        <div class="ai-progress-fill" id="ai-deploy-progress"></div>
                    </div>
                </div>

                <div class="ai-entry-footer">
                    <div class="muted" id="ai-entry-message">默认：P1 先手，普通难度。</div>
                    <button class="action-btn primary setup-start-btn" id="ai-start-btn">开始对战</button>
                </div>
            </div>
        </div>
    </section>

    <section class="ai-battle-page" id="ai-battle-page">
        <div class="card status-card ai-battle-head">
            <h2>对战状态</h2>
            <div id="ai-basic-info" class="status-line"></div>
        </div>

        <div class="ai-main-grid">
            <div class="card ai-resource-panel">
                <h2>玩家状态</h2>
                <div class="ai-resource-stack">
                    <div class="player-panel focused ai-resource-card">
                        <h2 id="ai-human-state-title">你的资源 (P1)</h2>
                        <div id="ai-p1-state" class="ai-resource-grid"></div>
                    </div>
                    <div class="player-panel ai-resource-card">
                        <h2 id="ai-opponent-state-title">AI 资源 (P2)</h2>
                        <div id="ai-p2-state" class="ai-resource-grid"></div>
                    </div>
                </div>
            </div>

            <div class="card ai-move-panel">
                <div class="ai-move-toolbar">
                    <h2>你的动作</h2>
                    <button class="action-btn" id="ai-clear-btn">清空</button>
                </div>
                <div id="ai-p1-move-groups" class="ai-move-groups"></div>
                <div class="ai-submit-row">
                    <div id="ai-message" class="ai-message-line">选择动作后出招。</div>
                    <button class="action-btn primary" id="ai-step-btn">出招</button>
                </div>
            </div>

            <div class="card ai-side-panel">
                <div class="ai-side-section">
                    <h2>AI 出招</h2>
                    <div class="ai-move-box" id="ai-move-box">
                        <div class="muted">等待你出招...</div>
                    </div>
                </div>
                <div class="ai-side-section">
                    <h2>最近结果</h2>
                    <div id="ai-latest-round" class="ai-latest-box compact">当前还没有回合记录。</div>
                </div>
                <div id="ai-history-wrap" class="ai-history-box hidden">
                    <h2>历史记录</h2>
                    <div id="ai-history"></div>
                </div>
            </div>
        </div>
    </section>
</div>

<!-- 结束弹窗 -->
<div id="ai-end-modal-mask" class="modal-mask">
    <div class="modal" style="max-width:460px;">
        <div class="modal-close-row">
            <button class="action-btn" id="ai-end-close-btn">关闭</button>
        </div>
        <div class="end-modal-content">
            <div><strong>游戏结束</strong></div>
            <div class="big-result" id="ai-end-result-text">结果</div>
            <div id="ai-end-result-detail" class="muted"></div>
            <div class="muted" style="margin-top:6px;">按 Enter 可快速重新开始，按 Backspace 可关闭弹窗。</div>
            <div style="margin-top:14px;">
                <button class="action-btn primary" id="ai-end-reset-btn">重新开始一局</button>
            </div>
        </div>
    </div>
</div>

<!-- 设置弹窗 -->
<div id="ai-settings-modal-mask" class="modal-mask">
    <div class="modal" style="max-width:460px;">
        <div class="modal-close-row">
            <button class="action-btn" id="ai-settings-close-btn">关闭</button>
        </div>
        <h2>对战显示设置</h2>
        <div class="ai-settings-grid">
            <label class="ai-setting-row">
                <div>显示动作英文名<br><span>例如 QI、SHIELD、GI。</span></div>
                <input type="checkbox" class="ai-setting-toggle" data-setting="showMoveCodes" />
            </label>
            <label class="ai-setting-row">
                <div>显示快捷键<br><span>动作按钮右上角的键盘提示。</span></div>
                <input type="checkbox" class="ai-setting-toggle" data-setting="showHotkeys" checked />
            </label>
            <label class="ai-setting-row">
                <div>显示 AI 策略<br><span>随机、启发式、模型降级等调试信息。</span></div>
                <input type="checkbox" class="ai-setting-toggle" data-setting="showPolicy" />
            </label>
            <label class="ai-setting-row">
                <div>显示推理耗时<br><span>每回合 AI 选招耗时。</span></div>
                <input type="checkbox" class="ai-setting-toggle" data-setting="showInference" />
            </label>
            <label class="ai-setting-row">
                <div>显示详细结算<br><span>双方说明和本回合总结。</span></div>
                <input type="checkbox" class="ai-setting-toggle" data-setting="showRoundDetails" />
            </label>
            <label class="ai-setting-row">
                <div>显示历史记录<br><span>打开后右侧会显示所有回合。</span></div>
                <input type="checkbox" class="ai-setting-toggle" data-setting="showHistory" />
            </label>
        </div>
    </div>
</div>

<!-- 全局弹窗遮罩 -->
<div class="modal-mask" id="global-modal-mask" style="z-index:1100;">
    <div class="modal-card" id="global-modal-card">
        <div class="modal-icon" id="global-modal-icon" style="display:none;"></div>
        <div class="modal-title" id="global-modal-title"></div>
        <div class="modal-body" id="global-modal-body"></div>
        <div class="modal-actions" id="global-modal-actions"></div>
    </div>
</div>

<script src="{{ url_for('static', filename='js/core/session.js') }}"></script>
<script src="{{ url_for('static', filename='js/core/api.js') }}"></script>
<script src="{{ url_for('static', filename='js/core/logout_button.js') }}"></script>
<script src="{{ url_for('static', filename='js/core/modal.js') }}"></script>
<script src="{{ url_for('static', filename='js/pages/admin_users_modal.js') }}"></script>
<script src="{{ url_for('static', filename='js/pages/ai_page.js') }}"></script>
<script>
    // 账号按钮
    if (window.SessionUtils) {
        var btn = document.getElementById("header-account-btn");
        if (btn) {
            var user = window.SessionUtils.getSessionUser();
            if (user) {
                btn.textContent = user.username;
                btn.addEventListener("click", function () {
                    window.location.href = "/v1/user/" + user.uid;
                });
            }
        }
    }
    if (typeof ModalUtils !== "undefined" && ModalUtils.bindGlobalModalEvents) {
        ModalUtils.bindGlobalModalEvents();
    }
</script>
</body>
</html>
