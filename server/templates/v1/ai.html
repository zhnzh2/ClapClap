<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ClapClap 1.0 AI 对战</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/v1/v1_local.css') }}" />
    <link rel="stylesheet" href="{{ url_for('static', filename='css/auth.css') }}" />
    <style>
        /* AI 页面额外样式 */
        .ai-diff-bar {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }
        .ai-diff-bar .label {
            font-weight: bold;
            color: var(--muted);
            font-size: 13px;
        }
        .ai-diff-btn {
            padding: 5px 16px;
            border: 2px solid var(--border);
            border-radius: 20px;
            background: var(--card);
            color: var(--text);
            cursor: pointer;
            font-size: 13px;
            font-weight: bold;
            transition: all 0.15s;
        }
        .ai-diff-btn:hover { border-color: var(--blue); color: var(--blue); }
        .ai-diff-btn.active {
            background: var(--blue);
            color: #fff;
            border-color: var(--blue);
        }
        .ai-move-box {
            min-height: 60px;
            padding: 14px;
            background: var(--status-bg);
            border-radius: 10px;
            border: 1px solid var(--border);
        }
        .ai-mode-summary {
            align-items: flex-start;
            background: linear-gradient(135deg, #ffffff, #f8fbff);
        }
        .ai-mode-copy {
            color: var(--muted);
            font-size: 13px;
            line-height: 1.5;
        }
        .ai-policy-pill {
            background: #ecfdf5;
            border-color: #bbf7d0;
            color: #166534;
        }
        .ai-thinking-dot {
            display: inline-block;
            animation: ai-blink 1s infinite;
        }
        @keyframes ai-blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }
    </style>
</head>
<body>
<div class="container">
    <!-- 顶部 -->
    <div class="page-top-shell">
        <a class="page-version-chip" href="/v2" title="切换到 2.0 多人版">2.0</a>
        <div class="header-actions">
            <a class="header-account-btn" href="/v1/rules">规则界面</a>
            <button class="header-account-btn" id="header-admin-btn" style="display:none;">查看用户</button>
            <button class="header-account-btn" id="header-account-btn">账号</button>
            <button class="header-account-btn danger" id="header-logout-btn">退出登录</button>
        </div>
        <div class="page-title-block">
            <h1>1.0 AI 对战</h1>
            <p>人机对战 · 你（P1） vs AI（P2）</p>
        </div>
    </div>

    <!-- 工具栏 -->
    <div class="page-mode-toolbar">
        <div class="page-mode-toolbar-label">模式操作</div>
        <div class="top-actions page-mode-toolbar-group">
            <button class="action-btn secondary" id="ai-refresh-btn">刷新状态</button>
            <button class="action-btn danger" id="ai-reset-btn">重新开始</button>
            <a class="action-btn secondary" href="/v1">返回大厅</a>
        </div>
    </div>

    <div class="page-mode-toolbar ai-mode-summary">
        <div class="page-mode-toolbar-label">AI 说明</div>
        <div class="ai-mode-copy">
            当前版本固定真人 P1、AI P2。普通/简单使用稳定启发式策略；困难模式会优先尝试部署模型，模型不可用时自动降级，并在状态栏显示真实策略。
        </div>
    </div>

    <!-- 双方资源 -->
    <div class="two-col">
        <div class="card">
            <h2>你的资源 (P1)</h2>
            <div class="player-panel p1-theme">
                <div id="ai-p1-state" class="resource-grid"></div>
            </div>
        </div>
        <div class="card">
            <h2>AI 资源 (P2)</h2>
            <div class="player-panel p2-theme">
                <div id="ai-p2-state" class="resource-grid"></div>
            </div>
        </div>
    </div>

    <!-- 难度选择 + 动作选择 -->
    <div class="card">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;flex-wrap:wrap;gap:8px;">
            <h2 style="margin:0;">你的动作</h2>
            <div class="ai-diff-bar">
                <span class="label">AI 难度：</span>
                <button class="ai-diff-btn" data-diff="easy">简单</button>
                <button class="ai-diff-btn" data-diff="normal">普通</button>
                <button class="ai-diff-btn" data-diff="hard">困难</button>
            </div>
        </div>

        <div id="ai-p1-move-groups"></div>

        <div class="submit-row">
            <button class="action-btn primary" id="ai-step-btn">出招</button>
            <button class="action-btn" id="ai-clear-btn">清空选择</button>
        </div>
    </div>

    <!-- AI 出招信息 -->
    <div class="card">
        <h2>AI 出招</h2>
        <div class="ai-move-box" id="ai-move-box">
            <div class="muted">等待你出招...</div>
        </div>
    </div>

    <!-- 消息 -->
    <div id="ai-message" class="message-box muted" style="padding:8px 14px;">页面已加载。</div>

    <!-- 状态行 -->
    <div class="card status-card">
        <div id="ai-basic-info" class="status-line"></div>
    </div>

    <!-- 底部：最近回合 + 历史 -->
    <div class="bottom-layout">
        <div class="card" id="ai-latest-round-card">
            <h2>最近一回合结果</h2>
            <div id="ai-latest-round" class="muted">当前还没有回合记录。</div>
        </div>
        <div class="card" id="ai-history-card">
            <h2>历史记录</h2>
            <div id="ai-history" class="history-list"></div>
        </div>
    </div>
</div>

<!-- 结束弹窗 -->
<div id="ai-end-modal-mask" class="modal-mask">
    <div class="modal" style="max-width:460px;">
        <div class="modal-close-row">
            <button class="action-btn" id="ai-end-close-btn">关闭</button>
        </div>
        <div class="end-modal-content">
            <div><strong>游戏结束</strong></div>
            <div class="big-result" id="ai-end-result-text">结果</div>
            <div id="ai-end-result-detail" class="muted"></div>
            <div class="muted" style="margin-top:6px;">按 Enter 可快速重新开始，按 Backspace 可关闭弹窗。</div>
            <div style="margin-top:14px;">
                <button class="action-btn primary" id="ai-end-reset-btn">重新开始一局</button>
            </div>
        </div>
    </div>
</div>

<!-- 全局弹窗遮罩 -->
<div class="modal-mask" id="global-modal-mask" style="z-index:1100;">
    <div class="modal-card" id="global-modal-card">
        <div class="modal-icon" id="global-modal-icon" style="display:none;"></div>
        <div class="modal-title" id="global-modal-title"></div>
        <div class="modal-body" id="global-modal-body"></div>
        <div class="modal-actions" id="global-modal-actions"></div>
    </div>
</div>

<script src="{{ url_for('static', filename='js/core/session.js') }}"></script>
<script src="{{ url_for('static', filename='js/core/api.js') }}"></script>
<script src="{{ url_for('static', filename='js/core/logout_button.js') }}"></script>
<script src="{{ url_for('static', filename='js/core/modal.js') }}"></script>
<script src="{{ url_for('static', filename='js/pages/account_modal.js') }}"></script>
<script src="{{ url_for('static', filename='js/pages/admin_users_modal.js') }}"></script>
<script src="{{ url_for('static', filename='js/pages/ai_page.js') }}"></script>
<script>
    // 账号按钮
    var btn = document.getElementById("header-account-btn");
    if (btn) {
        var user = window.SessionUtils.getSessionUser();
        if (user) {
            btn.textContent = user.username;
            btn.addEventListener("click", function () {
                window.location.href = "/v1/user/" + user.uid;
            });
        }
    }
    if (typeof ModalUtils !== "undefined" && ModalUtils.bindGlobalModalEvents) {
        ModalUtils.bindGlobalModalEvents();
    }
</script>
</body>
</html>
