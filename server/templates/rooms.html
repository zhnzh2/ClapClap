<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ClapClap 房间对战</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/rooms.css') }}" />
</head>
<body>
    <div class="container">
        <div class="top-row">
            <h1>双人开房间对战</h1>
            <a class="back-link" href="/">返回模式大厅</a>
        </div>

        {% if error_message %}
        <div class="error-box">{{ error_message }}</div>
        {% endif %}

        <div class="grid">
            <div class="card">
                <h2>创建房间</h2>
                <p>输入你的昵称后，创建一个新房间。系统会生成一个房间号，你可以把它发给另一位玩家。</p>
                <input id="create-name" type="text" placeholder="输入你的昵称" />
                <button id="create-room-btn">创建房间</button>
                <div id="create-message" class="message"></div>
            </div>

            <div class="card">
                <h2>加入房间</h2>
                <p>输入你的昵称和房间号，加入另一位玩家创建的房间。</p>
                <input id="join-name" type="text" placeholder="输入你的昵称" />
                <input id="join-room-id" type="text" placeholder="输入房间号" />
                <button id="join-room-btn">加入房间</button>
                <div id="join-message" class="message"></div>
            </div>
        </div>
    </div>
    <script src="{{ url_for('static', filename='js/core/storage.js') }}"></script>
    <script src="{{ url_for('static', filename='js/core/message.js') }}"></script>
    <script src="{{ url_for('static', filename='js/core/api.js') }}"></script>
    <script src="{{ url_for('static', filename='js/online/room_identity.js') }}"></script>
    <script src="{{ url_for('static', filename='js/pages/rooms_page.js') }}"></script>
</body>
</html>
